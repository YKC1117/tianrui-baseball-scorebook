.quicknav{display:flex;flex-wrap:wrap;gap:8px;margin:-5px 0 14px}.quicknav button{border:1px solid #dde4eb;background:#fff;color:#35526e;border-radius:11px;padding:9px 12px;min-height:40px;font-size:12px;font-weight:800}.quicknav button.on{background:#193b59;color:white;border-color:#193b59}.bulkDetails{margin-top:13px;padding:12px 14px;background:#f7fafc;border:1px solid #e4eaf0;border-radius:13px}.bulkDetails summary{font-size:13px;font-weight:800;color:#325672;cursor:pointer}.bulkDetails textarea{font:inherit}.bulkDetails textarea:focus{outline:2px solid #f5a14c;border-color:#e9a262}@media(max-width:600px){.quicknav{gap:6px}.quicknav button{flex:1;padding:8px 6px;font-size:11px;min-height:40px}}

<body>
<header><div class="inner"><div class="brand"><div id="logo" class="logo"><img src="./logo-tianrui.png" alt="天睿隊徽"></div><div><strong>天睿教育棒球隊</strong><small>單場紀錄系統 · 離線版 v1.2.0</small></div></div><span class="subtag">無需網路即可紀錄</span></div></header>
<main class="app" id="app"></main><div id="modalhost"></div>
<script>
'use strict';
(function(){
const KEY='TR_BASEBALL_OFFLINE_V1';
const resultNames={"1B":"一壘安打","2B":"二壘安打","3B":"三壘安打","HR":"全壘打","BB":"四壞保送","IBB":"故意四壞","HBP":"觸身球","SO":"三振","GO":"滾地出局","FO":"飛球出局","SF":"高飛犧牲打","SH":"犧牲觸擊","FC":"野手選擇","ROE":"失誤上壘","DP":"雙殺打"};
const ADV={SB:'盜壘',CS:'盜壘刺',WP:'暴投',PB:'捕逸',BK:'投手犯規',ADV:'其他進壘／跑壘'};
const n=(v)=>Number(v)||0;const uid=()=>('id_'+Math.random().toString(36).slice(2,10)+Date.now().toString(36));
const esc=(v)=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=(x,d=3)=>Number.isFinite(x)?x.toFixed(d):'—';
const deep=x=>JSON.parse(JSON.stringify(x));
const teamKeys=['away','home'];
function blankBat(){return {PA:0,AB:0,H:0,_1B:0,_2B:0,_3B:0,HR:0,BB:0,IBB:0,HBP:0,SO:0,SF:0,SH:0,FC:0,ROE:0,DP:0,R:0,RBI:0,SB:0,CS:0,PO:0,A:0,E:0};}
function blankPitch(){return {BF:0,outs:0,H:0,BB:0,HBP:0,SO:0,R:0,ER:0,pendingER:0,pitches:0,WP:0,BK:0};}
function defaultTeam(name,prefix){let roster=Array.from({length:12},(_,i)=>({id:uid(),num:String(i+1).padStart(2,'0'),name:(prefix==='TR'?'天睿球員':'對手球員')+' '+String(i+1).padStart(2,'0')}));let first={id:uid(),pid:roster[0].id,ordinal:1,startedAt:new Date().toISOString(),stats:blankPitch()};return {name,roster,lineup:roster.slice(0,9).map(x=>x.id),pitcher:roster[0].id,defense:{P:roster[0].id,C:'',B1:'',B2:'',B3:'',SS:'',LF:'',CF:'',RF:''},next:0,stats:{},pitchStats:{},pitchSessions:[first],activeSessionId:first.id,errors:0};}
function freshGame(side,opp,date){const away=side==='away'?defaultTeam('天睿教育棒球隊','TR'):defaultTeam(opp,'OP');const home=side==='home'?defaultTeam('天睿教育棒球隊','TR'):defaultTeam(opp,'OP');let g={id:uid(),date:date||new Date().toISOString().slice(0,10),away,home,side,inning:1,half:'top',outs:0,bases:[null,null,null],balls:0,strikes:0,score:{away:[0,...Array(8).fill(null)],home:Array(9).fill(null)},events:[],finished:false,createdAt:Date.now(),completedAt:null,note:''};for(let k of teamKeys){for(let p of g[k].roster){g[k].stats[p.id]=blankBat();g[k].pitchStats[p.id]=blankPitch();}}return g;}
let db;try{db=JSON.parse(localStorage.getItem(KEY)||'null');}catch{}if(!db||!Array.isArray(db.games))db={games:[],activeId:null,logo:null,settings:{scale:1}};
if(!db.settings)db.settings={scale:1};if(!['split','combined'].includes(db.settings.pitchView))db.settings.pitchView='split';let tab='home',statTeam='away',editTeam='away',modal=null,undoStack=[],futureStack=[],saveError='',tempCount=0,previewURL=null;

const POSITIONS=[['P','投手 P'],['C','捕手 C'],['B1','一壘 1B'],['B2','二壘 2B'],['B3','三壘 3B'],['SS','游擊 SS'],['LF','左外野 LF'],['CF','中外野 CF'],['RF','右外野 RF']];
const localISODate=()=>{let d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)};
function blankDraft(){return {date:localISODate(),opponent:'',side:'away',selected:[],lineup:[],positions:{}};}
if(!Array.isArray(db.clubRoster))db.clubRoster=[];
if(!db.draft||!Array.isArray(db.draft.selected)||!Array.isArray(db.draft.lineup))db.draft=blankDraft();
function draftSync(){const d=db.draft, ids=new Set(db.clubRoster.map(p=>p.id));d.selected=[...new Set(d.selected)].filter(id=>ids.has(id));d.lineup=[...new Set(d.lineup)].filter(id=>d.selected.includes(id)).slice(0,9);for(let id of d.selected){if(d.lineup.length<9&&!d.lineup.includes(id))d.lineup.push(id)}if(!d.positions||typeof d.positions!=='object')d.positions={};const taken=new Set(d.lineup.map(id=>d.positions[id]).filter(Boolean));for(let id of d.lineup){if(!POSITIONS.some(([p])=>p===d.positions[id])||d.lineup.filter(q=>d.positions[q]===d.positions[id]).length>1){const free=POSITIONS.find(([p])=>!taken.has(p));if(free){d.positions[id]=free[0];taken.add(free[0]);}}} }
draftSync();
function clubPlayer(id){return db.clubRoster.find(p=>p.id===id)}
function clubName(id){const p=clubPlayer(id);return p?`#${p.num} ${p.name}`:'未指定'}
function draftBench(){return db.draft.selected.filter(id=>!db.draft.lineup.includes(id))}
function draftErrors(){const d=db.draft,errors=[];if(db.clubRoster.length<9)errors.push('全隊名冊至少需要 9 人');if(d.selected.length<9)errors.push('至少勾選 9 名本週出賽球員');if(d.lineup.length!==9||new Set(d.lineup).size!==9)errors.push('先發必須排滿 1～9 棒，且不能重複');if(!d.opponent?.trim())errors.push('請填寫對手隊伍');if(!d.date)errors.push('請選擇比賽日期');const pos=d.lineup.map(id=>d.positions[id]);if(pos.length===9&&new Set(pos).size!==9)errors.push('九位先發守備位置不可重複');if(pos.some(p=>!POSITIONS.some(([v])=>v===p)))errors.push('請設定全部九個守備位置');return errors;}
function createGameFromDraft(){const err=draftErrors();if(err.length){alertText(err.join('\n'));return false;}const d=db.draft,side=d.side,game=freshGame(side,d.opponent.trim(),d.date),team=game[side];team.roster=d.selected.map(id=>deep(clubPlayer(id)));team.lineup=[...d.lineup];team.stats={};team.pitchStats={};for(let p of team.roster){team.stats[p.id]=blankBat();team.pitchStats[p.id]=blankPitch();}team.defense={};for(let id of d.lineup)team.defense[d.positions[id]]=id;team.pitcher=team.defense.P;team.pitchSessions=[];const first=newPitchSession(team,team.pitcher);team.next=0;team.errors=0;game.rosterSource='clubRoster-v1';game.lineupLockedAt=new Date().toISOString();db.games.push(game);db.activeId=game.id;tab='record';editTeam=side;statTeam=side;undoStack=[];futureStack=[];write();return true;}
function rosterJSON(){return JSON.stringify({format:'TR-CLUB-ROSTER-1',exportedAt:new Date().toISOString(),roster:db.clubRoster},null,2);}
function importClubRoster(raw){const x=JSON.parse(raw),list=x?.roster;if(x?.format!=='TR-CLUB-ROSTER-1'||!Array.isArray(list)||list.length>60)throw Error('不是天睿球隊名冊備份');const ids=new Set(),nums=new Set();const incoming=list.map(p=>{let id=String(p.id||uid()),num=String(p.num||'').trim(),name=String(p.name||'').trim();if(!name||!num||name.length>32||num.length>5||ids.has(id)||nums.has(num))throw Error('名冊中有空值、重複 ID 或背號');ids.add(id);nums.add(num);return {id,num,name};});if(!confirm('匯入將取代目前的全隊名冊（已建立的比賽不受影響），確定繼續？'))return;db.clubRoster=incoming;draftSync();write();}

function save(){try{localStorage.setItem(KEY,JSON.stringify(db));saveError='';}catch(e){saveError='瀏覽器儲存失敗，請立即匯出 JSON 備份。可能已達儲存容量上限。';}}
function g(){return db.games.find(x=>x.id===db.activeId)||null;}
function st(t,id){if(!t.stats[id])t.stats[id]=blankBat();return t.stats[id];}
function ps(t,id){if(!t.pitchStats[id])t.pitchStats[id]=blankPitch();return t.pitchStats[id];}
// 每一任投手擁有獨立登板段。保留舊版彙總欄位供備份及單場合計使用。
function newPitchSession(t,pid){if(!Array.isArray(t.pitchSessions))t.pitchSessions=[];let session={id:uid(),pid,ordinal:t.pitchSessions.filter(x=>x.pid===pid).length+1,startedAt:new Date().toISOString(),stats:blankPitch()};t.pitchSessions.push(session);t.activeSessionId=session.id;return session;}
function normalizePitchSessions(t){if(!Array.isArray(t.pitchSessions)){t.pitchSessions=[];for(let [pid,old] of Object.entries(t.pitchStats||{})){if(Object.values(old||{}).some(v=>Number(v)>0))t.pitchSessions.push({id:uid(),pid,ordinal:1,startedAt:null,legacy:true,stats:{...blankPitch(),...old}});}let active=t.pitchSessions.filter(x=>x.pid===t.pitcher).at(-1);if(active)t.activeSessionId=active.id;else newPitchSession(t,t.pitcher);}if(!t.pitchSessions.some(x=>x.id===t.activeSessionId&&x.pid===t.pitcher)){let last=t.pitchSessions.filter(x=>x.pid===t.pitcher).at(-1);if(last)t.activeSessionId=last.id;else newPitchSession(t,t.pitcher);}for(let ss of t.pitchSessions)ss.stats={...blankPitch(),...(ss.stats||{})};}
for(let game of db.games)for(let key of teamKeys)if(game[key])normalizePitchSessions(game[key]);
function activePitchSession(t){normalizePitchSessions(t);return t.pitchSessions.find(s=>s.id===t.activeSessionId);}
function pitchCredit(t,pid,key,amount=1,sessionId=null){ps(t,pid)[key]+=amount;normalizePitchSessions(t);let sess=(sessionId?t.pitchSessions.find(s=>s.id===sessionId&&s.pid===pid):null)||t.pitchSessions.find(s=>s.id===t.activeSessionId&&s.pid===pid)||t.pitchSessions.filter(s=>s.pid===pid).at(-1);if(sess)sess.stats[key]+=amount;}
function pitchName(t,s){let label=s.ordinal===1?'第 1 次登板':s.ordinal===2?'當日二次登板':`當日第 ${s.ordinal} 次登板`;return `${pn(t,s.pid)}（${label}${s.legacy?'／舊版合計':''}）`;}
function pitchRowsData(t){normalizePitchSessions(t);if(db.settings.pitchView==='combined'){return t.roster.filter(p=>{let z=ps(t,p.id);return z.BF||z.outs||z.pitches||z.R||z.H}).map(p=>({name:pn(t,p.id)+'（合併）',stats:ps(t,p.id)}));}return t.pitchSessions.filter(s=>{let z=s.stats;return z.BF||z.outs||z.pitches||z.R||z.H||z.BB||z.SO||s.ordinal>1}).map(s=>({name:pitchName(t,s),stats:s.stats}));}
function player(t,id){return t.roster.find(x=>x.id===id)||{name:'未知球員',num:'?'};}
function pn(t,id){let p=player(t,id);return `#${p.num} ${p.name}`;}
function offKey(){return g().half==='top'?'away':'home';}function defKey(){return g().half==='top'?'home':'away';}
function sum(a){return a.reduce((s,x)=>s+n(x),0)}
function scores(){let x=g();return {away:sum(x.score.away),home:sum(x.score.home)};}
function snapshot(){let cur=g();if(!cur)return;undoStack.push(deep(cur));if(undoStack.length>25)undoStack.shift();futureStack=[];}
function write(){save();render();}
function log(kind,message,desc=''){let x=g();x.events.push({id:uid(),time:new Date().toISOString(),inning:x.inning,half:x.half,kind,message,desc});}
function navigate(t){tab=t;modal=null;render();window.scrollTo({top:0,behavior:'instant'});}
function alertText(t){window.alert(t);}
function currentTeam(){return g()[offKey()];}
function nextBatter(){let t=currentTeam();return t.lineup[t.next];}
function teamOfSide(){return g()[g().side];}
function activeMark(){let x=g();return `${x.inning}局${x.half==='top'?'上':'下'}半`;}
function totalInning(k){return sum(g().score[k]);}
function setHalf(){let x=g();if(x.inning>=9&&x.half==='top'&&totalInning('home')>totalInning('away')){x.finished=true;x.completedAt=Date.now();log('game','九局上結束，主隊領先，結束比賽');return;}
 if(x.half==='top'){x.half='bottom';x.score.home[x.inning-1]=0;}else if(x.inning===9){x.finished=true;x.completedAt=Date.now();log('game','第九局結束，結束比賽');return;}else{x.inning++;x.half='top';x.score.away[x.inning-1]=0;}
 x.outs=0;x.bases=[null,null,null];x.balls=0;x.strikes=0;log('half',`進入 ${activeMark()}`);
}
function inningsBoard(){let x=g(),sc=scores();let th='<th>隊伍</th>'+Array.from({length:9},(_,i)=>`<th>${i+1}</th>`).join('')+'<th class="total">R</th><th class="total">H</th><th class="total">E</th>';
let rows=teamKeys.map(k=>{let t=x[k],hits=t.roster.reduce((z,p)=>z+n(st(t,p.id).H),0);return `<tr><td>${esc(t.name)}<span class="tiny muted"> ${k==='away'?'客／上':'主／下'}</span></td>${x.score[k].map((v,i)=>`<td class="${!x.finished&&x.inning===i+1&&offKey()===k?'current':''}">${v===null?'·':v}</td>`).join('')}<td class="total">${sc[k]}</td><td class="total">${hits}</td><td class="total">${t.errors}</td></tr>`}).join('');return `<div class="card"><div class="scorehead"><div class="center"><div class="teamName">${esc(x.away.name)}</div><div class="bigScore num">${sc.away}</div><span class="tiny muted">客隊</span></div><div class="center"><span class="vs">VS</span><div class="pill ${x.finished?'orange':''}" style="margin-top:5px">${x.finished?'已結束':activeMark()}</div></div><div class="center"><div class="teamName">${esc(x.home.name)}</div><div class="bigScore num">${sc.home}</div><span class="tiny muted">主隊</span></div></div><div class="scroller" style="margin-top:15px"><table class="scoretable"><thead><tr>${th}</tr></thead><tbody>${rows}</tbody></table></div><div class="row between" style="margin-top:9px"><span class="small muted">${esc(x.date)} · ${x.finished?'比賽結束':'進行中'} · 最多顯示第 1～9 局</span><span class="small muted">R 得分 · H 安打 · E 失誤</span></div></div>`;}
function baseSVG(){let x=g(),bat=currentTeam(),b=x.bases;let position=(idx)=>b[idx]?`<div class="baseLabel on b${idx+1}">${esc(pn(bat,b[idx].pid))}</div>`:`<div class="baseLabel b${idx+1}">${idx+1} 壘</div>`;
return `<div class="diamondArea"><div class="diamond"><svg viewBox="0 0 166 142"><path d="M83 14 L151 75 L83 132 L15 75 Z" fill="#eaf3ed" stroke="#648d77" stroke-width="3"/><path d="M83 14 L151 75 L83 132 L15 75 Z" fill="none" stroke="#fff" stroke-width="2"/><path d="M83 14 L151 75 L83 132 L15 75 Z" fill="none" stroke="#becdc0" stroke-width="1"/><path d="M83 118 L93 127 L83 137 L73 127Z" fill="#d9e4ed" stroke="#66829a"/></svg>${position(0)}${position(1)}${position(2)}<div class="baseLabel homeplate">本壘</div></div></div>`;}
function selectOptions(t,chosen,none=false){return (none?'<option value="">— 請選擇 —</option>':'')+t.roster.map(p=>`<option value="${p.id}" ${p.id===chosen?'selected':''}>${esc(pn(t,p.id))}</option>`).join('');}
function appShell(content){const x=g();const navs=[['home','首頁','⌂'],['team','球員名單','♙'],['setup','本週出賽','☑'],['record','比賽紀錄','⚾'],['stats','單場數據','▥'],['files','匯出備份','⇩']];let btn=(k,label,sym,cls)=>`<button class="${cls||''} ${tab===k?'active':''}" data-tab="${k}" ${!x&&['record','stats','files'].includes(k)?'disabled':''}><i>${sym}</i><span>${label}</span></button>`;let top=`<nav class="mainnav" aria-label="主要功能">${navs.map(([k,l,s])=>`<button class="${tab===k?'active':''}" data-tab="${k}" ${!x&&['record','stats','files'].includes(k)?'disabled':''}>${l}</button>`).join('')}${x?'<button data-tab="lineup">賽中換人</button><button data-tab="history">操作紀錄</button>':''}</nav>`;let score=x&&['record','stats','lineup','history','files'].includes(tab)?inningsBoard():'';let quick=x&&['record','stats','lineup','history','files'].includes(tab)?`<div class="quicknav"><button class="${tab==='lineup'?'on':''}" data-tab="lineup">⇄ 賽中換人／守位</button><button class="${tab==='history'?'on':''}" data-tab="history">↶ 操作紀錄</button><button class="${tab==='files'?'on':''}" data-tab="files">⇩ 圖片與備份</button></div>`:'';let bottom=`<div class="mobileDock">${navs.slice(0,5).map(([k,l,s])=>btn(k,l,s,'')).join('')}</div>`;return `${top}${saveError?`<div class="notice red">${esc(saveError)}</div>`:''}${score}${quick}${content}<div class="footer">天睿教育棒球隊 · 離線資料儲存在此裝置 · 請定期備份</div>${bottom}`;}

function homePage(){let active=g(),isLive=active&&!active.finished,cards=[...db.games].sort((a,b)=>b.createdAt-a.createdAt).map(x=>{let aa=sum(x.score.away),hh=sum(x.score.home);return `<div class="gameCard"><div><b>${esc(x.away.name)} <span style="color:#e98127">${aa} : ${hh}</span> ${esc(x.home.name)}</b><p>${esc(x.date)} · ${x.finished?'已結束':'進行中'} · ${x.inning}局${x.half==='top'?'上':'下'}半</p></div><button class="btn small primary" data-open="${x.id}">${x.finished?'查看':'繼續'}</button></div>`}).join('');return `<section class="hero"><div class="heroEyebrow">TIANRUI BASEBALL / SCOREBOOK</div><h1>場邊紀錄，交給天睿自己的系統。</h1><p>先建立一次全隊球員資料。每週只要勾選到場球員、安排九棒與守備，就能開始紀錄比分與投打守跑。</p><div class="heroActions"><button class="btn primary" data-tab="${db.clubRoster.length?'setup':'team'}">${db.clubRoster.length?'安排本週出賽 →':'建立全隊名單 →'}</button>${isLive?'<button class="btn orange" data-tab="record">繼續目前比賽</button>':''}</div></section><div class="workflow"><div class="step"><span class="stepnum">01 · 球隊</span><div><strong>建立全隊名冊</strong><p>只需姓名、背號；以後都能沿用。</p></div></div><div class="step"><span class="stepnum">02 · 賽前</span><div><strong>勾選出賽、排九棒</strong><p>先發九人＋板凳，守位可調整。</p></div></div><div class="step"><span class="stepnum">03 · 比賽</span><div><strong>現場紀錄與匯出</strong><p>逐球、換投、比分、PNG 分享。</p></div></div></div><section class="card"><div class="sectionHead"><div><div class="sectionEyebrow">TEAM STATUS</div><h2 style="margin:0">球隊準備狀況</h2></div><button class="btn small" data-tab="team">管理名冊</button></div><div class="metricRow"><div class="metric"><b>${db.clubRoster.length}</b><span>球隊總人數</span></div><div class="metric"><b>${db.draft.selected.length}</b><span>本週勾選出賽</span></div><div class="metric"><b>${db.draft.lineup.length}</b><span>先發棒次已排</span></div></div><button class="btn orange" style="width:100%" data-tab="setup">前往本週賽前排陣</button></section><section class="card"><div class="sectionHead"><div><div class="sectionEyebrow">GAMES</div><h2 style="margin:0">本機比賽紀錄</h2></div><span class="pill">${db.games.length} 場</span></div>${cards||'<div class="empty"><strong>還沒有比賽</strong>完成球員名冊與本週陣容，即可建立第一場紀錄。</div>'}</section><div class="notice">資料只保存在目前手機／平板的瀏覽器中。使用無痕模式、清除網站資料或換裝置可能遺失，請每場匯出 JSON。</div>`;}

function recordPage(){let x=g(),atk=currentTeam(),def=x[defKey()],b=player(atk,nextBatter()),p=player(def,def.pitcher),bs=st(atk,b.id),pp=ps(def,p.id),occupied=x.bases.filter(Boolean).length;
let actions=[["1B","hit"],["2B","hit"],["3B","hit"],["HR","hit"],["BB",""],["IBB",""],["HBP",""],["SO","out"],["GO","out"],["FO","out"],["SF","out"],["SH","out"],["FC",""],["ROE",""],["DP","out"]];
let ab=actions.map(([k,c])=>`<button class="${c}" data-result="${k}" ${x.finished?'disabled':''}>${k}<span>${resultNames[k]}</span></button>`).join('');
return `<div class="split"><section><div class="card"><div class="section-title"><h2>目前攻守與跑壘</h2><span class="pill">${x.finished?'比賽已結束':esc(atk.name)+' 攻擊'}</span></div><div class="liveTop"><div><div class="small muted">第 ${atk.next+1} 棒 · 目前打者</div><div class="batter">${esc(pn(atk,b.id))}</div><div class="statRow"><span>AB <b>${bs.AB}</b></span><span>H <b>${bs.H}</b></span><span>RBI <b>${bs.RBI}</b></span><span>AVG <b>${bs.AB?fmt(bs.H/bs.AB):'—'}</b></span></div><div class="small muted" style="margin-top:11px">投手：${esc(pn(def,p.id))}</div><div class="statRow"><span>本次 IP <b>${Math.floor(activePitchSession(def).stats.outs/3)}.${activePitchSession(def).stats.outs%3}</b></span><span>本次 SO <b>${activePitchSession(def).stats.SO}</b></span><span>本次球數 <b>${activePitchSession(def).stats.pitches}</b></span></div><div class="tiny muted" style="margin-top:6px">${esc(pitchName(def,activePitchSession(def)))} · 當日合計 ${Math.floor(pp.outs/3)}.${pp.outs%3} IP</div></div><div class="center"><div class="small muted">出局</div><div class="outs">${[0,1,2].map(i=>`<div class="outdot ${i<x.outs?'on':''}"></div>`).join('')}</div><div class="small muted" style="margin-top:5px">${x.outs} OUT</div></div></div>${baseSVG()}<div class="row between"><span class="small muted">壘上 ${occupied} 人</span><span class="small muted">B ${x.balls} · S ${x.strikes} · O ${x.outs}</span></div></div><div class="card"><div class="section-title"><h2>本打席投球記錄（選用）</h2><span class="small muted">已投 ${pp.pitches} 球</span></div><div class="grid g3"><button class="btn pitchbutton" data-pitch="B" ${x.finished?'disabled':''}>+ 壞球 B</button><button class="btn pitchbutton" data-pitch="S" ${x.finished?'disabled':''}>+ 好球 S</button><button class="btn pitchbutton" data-pitch="F" ${x.finished?'disabled':''}>+ 界外 F</button></div><div class="small muted" style="margin-top:8px">不逐球記也能記打席，但投球數會不完整。第四壞球／第三好球請再選擇下方打席結果。</div></div><div class="card"><h2>記錄打席結果</h2><div class="actiongrid">${ab}</div><div class="small muted" style="margin-top:10px">選擇結果後，會先顯示各跑者進壘與自責分確認，可修改後才正式寫入。</div></div></section><aside><div class="card"><div class="section-title"><h2>特殊事件</h2><span class="pill orange">乙組彈性換人</span></div><div class="grid g2"><button class="btn" data-run="ADV" ${x.finished?'disabled':''}>跑壘／進壘</button><button class="btn" data-run="SB" ${x.finished?'disabled':''}>盜壘</button><button class="btn" data-run="CS" ${x.finished?'disabled':''}>盜壘刺</button><button class="btn" data-run="WP" ${x.finished?'disabled':''}>暴投</button><button class="btn" data-run="PB" ${x.finished?'disabled':''}>捕逸</button><button class="btn" data-run="BK" ${x.finished?'disabled':''}>投手犯規</button><button class="btn" id="substitute" ${x.finished?'disabled':''}>打序換人</button><button class="btn" id="pitcherChange" ${x.finished?'disabled':''}>更換投手</button><button class="btn" id="fielding" ${x.finished?'disabled':''}>補登守備</button><button class="btn" id="manualHalf" ${x.finished?'disabled':''}>手動換半局</button></div><div class="divider"></div><div class="row"><button class="btn ghost" id="undo" ${!undoStack.length?'disabled':''}>↶ 復原</button><button class="btn ghost" id="redo" ${!futureStack.length?'disabled':''}>↷ 重做</button><button class="btn danger" id="finish" ${x.finished?'disabled':''}>結束比賽</button></div><div class="small muted" style="margin-top:9px">時間到可直接結束，不必完成 9 局。跑者留壘與未完成半局會原樣保留。</div></div><div class="card"><h2>打序速覽</h2>${atk.lineup.map((id,i)=>`<div class="lineuprow"><span class="slot">${i+1}</span><span class="who ${i===atk.next?'current':''}">${esc(pn(atk,id))}</span>${i===atk.next?'<span class="pill orange">打擊中</span>':''}</div>`).join('')}</div></aside></div>`;}
function battingRows(t){let rr=t.roster.filter(p=>{let z=st(t,p.id);return z.PA||z.PO||z.A||z.E||z.SB||z.CS;});if(!rr.length)return '<tr><td colspan="14" class="muted">尚無紀錄</td></tr>';return rr.map(p=>{let z=st(t,p.id),obden=z.AB+z.BB+z.HBP+z.SF,avg=z.AB?fmt(z.H/z.AB):'—',ob=obden?fmt((z.H+z.BB+z.HBP)/obden):'—',slg=z.AB?fmt((z._1B+2*z._2B+3*z._3B+4*z.HR)/z.AB):'—',ops=(z.AB&&obden)?fmt((z.H+z.BB+z.HBP)/obden+(z._1B+2*z._2B+3*z._3B+4*z.HR)/z.AB):'—';return `<tr><td>${esc(pn(t,p.id))}</td><td>${z.PA}</td><td>${z.AB}</td><td>${z.H}</td><td>${z.R}</td><td>${z.RBI}</td><td>${z.BB}</td><td>${z.SO}</td><td>${z._2B}</td><td>${z._3B}</td><td>${z.HR}</td><td class="statStrong">${avg}</td><td class="statStrong">${ob}</td><td class="statStrong">${slg}</td><td class="statStrong">${ops}</td></tr>`;}).join('');}
function pitchingRows(t){let rr=pitchRowsData(t);if(!rr.length)return '<tr><td colspan="13" class="muted">尚無投球紀錄</td></tr>';return rr.map(({name,stats:z})=>{let ip=Math.floor(z.outs/3)+'.'+z.outs%3,era=z.pendingER?'待判':z.outs?fmt(z.ER*27/z.outs,2):'—',whip=z.outs?fmt((z.BB+z.H)*3/z.outs,2):'—';return `<tr><td>${esc(name)}</td><td>${ip}</td><td>${z.BF}</td><td>${z.H}</td><td>${z.BB}</td><td>${z.HBP}</td><td>${z.SO}</td><td>${z.R}</td><td>${z.ER}${z.pendingER?` (+${z.pendingER}待判)`:''}</td><td>${z.pitches}</td><td>${z.WP}</td><td class="statStrong">${era}</td><td class="statStrong">${whip}</td></tr>`;}).join('');}
function statsPage(){let x=g(),t=x[statTeam],rows=t.roster.filter(p=>{let z=st(t,p.id);return z.PA||z.PO||z.A||z.E||z.SB||z.CS;}).map(p=>{let z=st(t,p.id),c=z.PO+z.A+z.E;return `<tr><td>${esc(pn(t,p.id))}</td><td>${z.PO}</td><td>${z.A}</td><td>${z.E}</td><td class="statStrong">${c?fmt((z.PO+z.A)/c):'—'}</td><td>${z.SB}</td><td>${z.CS}</td></tr>`;}).join('');return `<div class="card"><div class="section-title"><h2>單場球員數據</h2><span class="pill orange">${x.finished?'最終':'即時'}</span></div><div class="tabs"><button class="btn ${statTeam==='away'?'sel':''}" data-statteam="away">客隊 ${esc(x.away.name)}</button><button class="btn ${statTeam==='home'?'sel':''}" data-statteam="home">主隊 ${esc(x.home.name)}</button></div><h3>打擊</h3><div class="scroller"><table class="table"><thead><tr><th>球員</th><th>PA</th><th>AB</th><th>H</th><th>R</th><th>RBI</th><th>BB</th><th>SO</th><th>2B</th><th>3B</th><th>HR</th><th>AVG</th><th>OBP</th><th>SLG</th><th>OPS</th></tr></thead><tbody>${battingRows(t)}</tbody></table></div><div class="divider"></div><h3>投手</h3><div class="tabs"><button class="btn ${db.settings.pitchView==='split'?'sel':''}" data-pitchview="split">分次登板</button><button class="btn ${db.settings.pitchView==='combined'?'sel':''}" data-pitchview="combined">當日合併</button></div><div class="scroller"><table class="table"><thead><tr><th>球員</th><th>IP</th><th>BF</th><th>H</th><th>BB</th><th>HBP</th><th>SO</th><th>R</th><th>ER</th><th>球數</th><th>WP</th><th>ERA</th><th>WHIP</th></tr></thead><tbody>${pitchingRows(t)}</tbody></table></div><div class="divider"></div><h3>守備／跑壘</h3><div class="scroller"><table class="table"><thead><tr><th>球員</th><th>PO</th><th>A</th><th>E</th><th>守備率</th><th>SB</th><th>CS</th></tr></thead><tbody>${rows||'<tr><td colspan="7" class="muted">尚無紀錄</td></tr>'}</tbody></table></div></div><div class="notice blue">打擊率 AVG = H/AB；上壘率 OBP = (H+BB+HBP)/(AB+BB+HBP+SF)；長打率 SLG = TB/AB。單場數據僅供比賽參考。防禦率 ERA 採 9 局換算（ER×27／投手出局數），無自責分判定或 0 出局數時不顯示可比較數值。守備 PO/A 必須由紀錄員補登。</div>`;}
function lineupPage(){let x=g(),t=x[editTeam];return `<div class="card"><div class="section-title"><h2>當場名單與賽中換人</h2><span class="pill">9 人固定打序 · 可重返</span></div><div class="tabs"><button class="btn ${editTeam==='away'?'sel':''}" data-editteam="away">客隊</button><button class="btn ${editTeam==='home'?'sel':''}" data-editteam="home">主隊</button></div><div class="field"><label>隊伍名稱</label><div class="row"><input class="edit grow" id="teamName" value="${esc(t.name)}" maxlength="45"><button class="btn small primary" id="saveTeamName">更新隊名</button></div></div><div class="divider"></div><h3>本場已報名球員（最多 40 人）</h3><div id="rosterFields">${t.roster.map((p,i)=>`<div class="frow"><input aria-label="球員背號" data-num="${p.id}" value="${esc(p.num)}" maxlength="5"><input aria-label="球員姓名" data-name="${p.id}" value="${esc(p.name)}" maxlength="32"><button aria-label="移除球員" data-remove="${p.id}" ${t.roster.length<=9?'disabled':''}>×</button></div>`).join('')}</div><div class="row"><button class="btn small" id="addPlayer" ${t.roster.length>=40?'disabled':''}>＋ 新增球員</button><button class="btn small primary" id="saveRoster">儲存姓名／背號</button></div><div class="notice blue" style="margin-top:10px">更改球員姓名、背號不會清除已有成績。已有比賽紀錄的球員不能刪除；需要暫時退場請使用換人。</div><div class="divider"></div><h3>目前 1～9 棒</h3>${t.lineup.map((id,i)=>`<div class="lineuprow"><span class="slot">${i+1}</span><span class="who">${esc(pn(t,id))}</span>${!x.finished?`<button class="btn small" data-subslot="${i}">換人</button>`:'<span class="tiny muted">已結束</span>'}</div>`).join('')}<div class="divider"></div><h3>目前投手</h3><div class="row"><b>${esc(pitchName(t,activePitchSession(t)))}</b>${!x.finished?'<button class="btn small" id="changePitchTeam">更換投手</button>':''}</div><div class="small muted" style="margin-top:8px">每次換投都另開一筆登板紀錄。二次登板與首次登板分開計算，也能於「單場數據」切換當日合計；投手可再次登板或改守其他位置。</div><div class="divider"></div><h3>防守位置（可隨時調整）</h3>${[['P','投手'],['C','捕手'],['B1','一壘手'],['B2','二壘手'],['B3','三壘手'],['SS','游擊手'],['LF','左外野'],['CF','中外野'],['RF','右外野']].map(([key,name])=>`<div class="row" style="margin-bottom:7px;flex-wrap:nowrap"><label style="width:80px;margin:0;flex-shrink:0">${name}</label><select class="edit" data-def="${key}" ${key==='P'?'disabled':''}>${selectOptions(t,t.defense?.[key]||'',true)}</select></div>`).join('')}<button class="btn small primary" id="saveDefense" ${x.finished?'disabled':''}>儲存防守位置</button><div class="small muted" style="margin-top:8px">打序與守備位置分開管理，換守位不會更動打擊棒次。投手位置由「更換投手」控制。</div></div>`;}

function teamPage(){const rr=db.clubRoster.map((p,i)=>`<div class="rosterItem"><span class="jersey">${esc(p.num)}</span><input class="edit" data-club-name="${p.id}" value="${esc(p.name)}" aria-label="${esc(p.num)}號球員姓名" maxlength="32"><input class="edit" data-club-num="${p.id}" value="${esc(p.num)}" aria-label="${esc(p.name)}球員背號" maxlength="5"><button class="rm" data-club-remove="${p.id}" aria-label="移除${esc(p.name)}">×</button></div>`).join('');return `<div class="sectionHead"><div><div class="sectionEyebrow">TEAM ROSTER</div><h1>全隊球員名單</h1><p>球員只需建立一次，往後每週勾選出賽即可沿用。</p></div><span class="pill">${db.clubRoster.length} 位球員</span></div><section class="card"><div class="sectionHead"><div><h2 style="margin:0">新增球員</h2><p style="margin:5px 0 0;font-size:12px;color:#7e8b99">背號＋姓名，最多 60 人</p></div></div><div class="rosterAdd"><div class="field"><label for="clubNum">背號</label><input id="clubNum" inputmode="numeric" maxlength="5" placeholder="08"></div><div class="field"><label for="clubName">球員姓名</label><input id="clubName" maxlength="32" placeholder="輸入姓名"></div><button class="btn orange" id="clubAdd">＋ 新增</button></div><details class="bulkDetails"><summary>一次貼上多名球員（批次新增）</summary><p class="small muted" style="margin:10px 0">每行輸入「背號 姓名」，例如：01 王小明。已有的背號會自動略過。</p><textarea id="clubBulk" rows="5" placeholder="01 王小明&#10;05 陳大華&#10;12 林小安" style="width:100%;padding:10px;min-height:110px;border:1px solid #d6dfe7;border-radius:12px"></textarea><button id="clubBulkAdd" class="btn primary" style="margin-top:9px;width:100%">匯入貼上的球員</button></details></section><section class="card"><div class="sectionHead"><div><h2 style="margin:0">正式球隊名冊</h2><p style="font-size:12px;margin:6px 0 0;color:#7e8b99">直接修改名字或背號，最後點「儲存修改」。</p></div><span class="pill orange">永久沿用</span></div>${rr?`<div class="rosterList">${rr}</div><button style="width:100%;margin-top:15px" class="btn primary" id="clubSave">儲存名冊修改</button>`:'<div class="empty"><strong>還沒有球員</strong>先從上方新增球員，之後會自動出現在每週出賽勾選表。</div>'}</section><section class="card"><h2>備份全隊名單</h2><p class="small muted">名冊與比賽紀錄分開保存，避免每週重新輸入。建議建立完成後備份一次。</p><div class="row"><button class="btn" id="clubExport">下載名冊 JSON</button><label class="btn" style="display:inline-flex;align-items:center;margin:0;cursor:pointer">匯入名冊 JSON<input type="file" id="clubImport" hidden accept=".json,application/json"></label></div></section>${db.clubRoster.length>=9?'<button class="btn orange" style="width:100%" data-tab="setup">下一步：勾選本週出賽球員 →</button>':''}`;}
function setupPage(){draftSync();const d=db.draft,players=[...db.clubRoster].sort((a,b)=>Number(d.selected.includes(b.id))-Number(d.selected.includes(a.id))||String(a.num).localeCompare(String(b.num),'zh-Hant',{numeric:true}));const tiles=players.map(p=>{const selected=d.selected.includes(p.id);const starter=d.lineup.includes(p.id);return `<label class="selectTile ${selected?'checked':''}"><input type="checkbox" data-attend="${p.id}" ${selected?'checked':''}><span class="number">${esc(p.num)}</span><span><b>${esc(p.name)}</b><small>${!selected?'尚未勾選':starter?'先發九人':'替補／板凳'}</small></span></label>`}).join('');const selected=db.clubRoster.filter(p=>d.selected.includes(p.id));const options=selected.map(p=>`<option value="${p.id}">${esc(clubName(p.id))}</option>`).join('');const rows=Array.from({length:9},(_,i)=>{const id=d.lineup[i],pos=id?d.positions[id]:'';return `<div class="orderRow"><span class="orderNo">${i+1}</span><select class="edit" aria-label="第${i+1}棒" data-batting-slot="${i}"><option value="">${id?'':'— 尚未安排 —'}</option>${selected.map(p=>`<option value="${p.id}" ${p.id===id?'selected':''}>${esc(clubName(p.id))}</option>`).join('')}</select><select class="edit posSelect" data-position-slot="${i}" aria-label="第${i+1}棒守備位置" ${!id?'disabled':''}>${POSITIONS.map(([value,label])=>`<option value="${value}" ${value===pos?'selected':''}>${label}</option>`).join('')}</select><div class="orderBtns"><button data-move-order="${i}:-1" ${!id||i===0?'disabled':''} aria-label="第${i+1}棒上移">↑</button><button data-move-order="${i}:1" ${!id||i===8?'disabled':''} aria-label="第${i+1}棒下移">↓</button></div></div>`}).join('');const bench=draftBench();const errs=draftErrors();return `<div class="sectionHead"><div><div class="sectionEyebrow">GAME DAY / LINEUP</div><h1>本週出賽與先發排陣</h1><p>先勾選誰到場，再調整先發九棒、守備位置；其他人自動列為板凳。</p></div><span class="pill orange">固定九棒 · 彈性換人</span></div><section class="card"><div class="sectionHead"><h2 style="margin:0">① 比賽基本資料</h2><span class="pill">單場</span></div><div class="grid g2"><div class="field"><label>比賽日期</label><input id="draftDate" type="date" value="${esc(d.date)}"></div><div class="field"><label>對手隊名</label><input id="draftOpponent" placeholder="例如：某某棒球隊" value="${esc(d.opponent)}" maxlength="40"></div></div><div style="height:10px"></div><div class="field"><label>天睿本場身分</label><select id="draftSide"><option value="away" ${d.side==='away'?'selected':''}>客隊 · 上半局先打</option><option value="home" ${d.side==='home'?'selected':''}>主隊 · 下半局後打</option></select></div></section><section class="card"><div class="sectionHead"><div><h2 style="margin:0">② 勾選本週出賽球員</h2><p style="margin:6px 0 0;color:#8290a1;font-size:12px">點一下即可選取；已勾選 ${d.selected.length} 位</p></div><div class="row"><button class="btn small" id="attendAll">全選</button><button class="btn small" id="attendClear">清除</button></div></div>${tiles?`<div class="selectionList">${tiles}</div>`:'<div class="empty"><strong>球隊名冊是空的</strong>請先建立球員資料。</div>'}</section><section class="card"><div class="sectionHead"><div><h2 style="margin:0">③ 先發九棒與守備位置</h2><p style="margin:6px 0 0;color:#8290a1;font-size:12px">點選球員替換，↑↓ 調整棒次；守位會跟著球員移動。</p></div><span class="pill">${d.lineup.length} / 9 棒</span></div><div class="lineupEdit">${rows}</div><div class="notice blue" style="margin-top:12px;margin-bottom:0">更換先發球員會把原先發移到板凳；同一人不能佔兩個棒次。投手必須從九個守位中指定一人。</div></section><section class="card"><div class="sectionHead"><h2 style="margin:0">④ 板凳／替補名單</h2><span class="pill">${bench.length} 位</span></div>${bench.length?`<div class="benchList">${bench.map(id=>`<span class="benchChip">${esc(clubName(id))}</span>`).join('')}</div>`:'<p class="small muted" style="margin:0">沒有板凳球員。勾選超過九人就會自動出現。</p>'}</section><div class="readyBar"><div><b>${errs.length?'尚未完成開賽設定':'出賽名單已準備好'}</b><span>${errs.length?esc(errs.join(' · ')):`${d.selected.length} 位出賽 · 9 位先發 · ${bench.length} 位替補`}</span></div><button id="startDraftGame" class="btn orange" ${errs.length?'disabled':''}>確認名單，開始紀錄 →</button></div>`;}

function historyPage(){let x=g();return `<div class="card"><div class="section-title"><h2>比賽事件紀錄</h2><span class="pill">${x.events.length} 筆</span></div><div class="row"><button class="btn small" id="undo2" ${!undoStack.length?'disabled':''}>↶ 復原最近一次</button><button class="btn small" id="redo2" ${!futureStack.length?'disabled':''}>↷ 重做</button></div><div class="notice blue" style="margin-top:10px">本版支援最近 25 次操作復原（同一次開啟期間）；不支援直接編輯很久之前的單筆事件。正式比賽請定期匯出 JSON 保存。</div>${[...x.events].reverse().map((e,i)=>`<div class="event"><div class="n">#${x.events.length-i}<br>${e.inning}${e.half==='top'?'上':'下'}</div><div><b>${esc(e.message)}</b><div class="desc">${esc(e.desc)} · ${new Date(e.time).toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'})}</div></div></div>`).join('')||'<div class="empty">尚未登錄任何事件</div>'}</div>`;}
function filesPage(){let x=g();return `<div class="card"><h2>匯出比賽圖片</h2><p class="muted">產生包含 1～9 局比分、雙方打擊數據、投手數據的 PNG 圖片，方便傳給小編或分享 LINE。投手會依「單場數據」目前選擇的分次／合併模式輸出。</p><button class="btn orange" id="exportPNG">產生分享圖片 PNG</button></div><div class="card"><h2>本機資料備份</h2><div class="notice red">瀏覽器本機保存不是永久備份。手機換機、清除快取或瀏覽器資料時可能遺失；比賽結束務必下載 JSON。</div><div class="row"><button class="btn primary" id="exportJSON">匯出本場 JSON 備份</button><button class="btn" id="exportCSV">匯出本場 CSV 統計</button><label class="btn" style="margin:0;color:var(--text);display:inline-flex;align-items:center;cursor:pointer">匯入 JSON<input type="file" id="importJSON" accept=".json,application/json" hidden></label></div></div><div class="card"><h2>球隊 Logo</h2><div class="row"><div class="logo" id="logoSettings"><img src="./logo-tianrui.png" alt="天睿隊徽"></div><div class="grow"><div class="small muted">載入現有 Logo 圖片，會用於首頁及匯出報表。圖片僅儲存在這個瀏覽器內。</div><label class="btn small" style="display:inline-block;cursor:pointer;margin-top:6px">選擇 PNG／JPG<input type="file" id="logoUpload" accept="image/png,image/jpeg,image/webp" hidden></label></div></div><div class="divider"></div><h3>畫面縮放</h3><input id="fontScale" type="range" min="0.9" max="1.25" step="0.05" value="${db.settings.scale||1}" style="width:100%"><div class="small muted">此設定儲存於本機。</div></div><div class="card"><h2>比賽管理</h2><p class="muted">時間到可以提前結束，之後仍可查看及匯出成績。</p><div class="row">${!x.finished?'<button class="btn danger" id="finish2">結束這場比賽</button>':''}<button class="btn" id="backHome">返回全部比賽</button><button class="btn danger" id="deleteGame">刪除此場</button></div></div>`;}
function render(){document.documentElement.style.setProperty('--scale',db.settings.scale||1);let logo=document.getElementById('logo');if(logo)logo.innerHTML=`<img src="${db.logo||'./logo-tianrui.png'}" alt="天睿隊徽">`;let x=g(),content;if(tab==='home')content=homePage();else if(tab==='team')content=teamPage();else if(tab==='setup')content=setupPage();else if(!x)content=homePage();else if(tab==='record')content=recordPage();else if(tab==='stats')content=statsPage();else if(tab==='lineup')content=lineupPage();else if(tab==='history')content=historyPage();else content=filesPage();document.getElementById('app').innerHTML=appShell(content);if(x&&tab==='files')document.getElementById('logoSettings').innerHTML=`<img src="${db.logo||'./logo-tianrui.png'}" alt="天睿隊徽">`;document.getElementById('modalhost').innerHTML=modal||'';}

function showModal(s){modal=`<div class="modalback"><div class="modal" role="dialog" aria-modal="true">${s}</div></div>`;render();let close=document.querySelector('.modalback');if(close)close.addEventListener('click',e=>{if(e.target===close)closeModal()});}
function closeModal(){modal=null;render();}
function selectDest(value){return `<option value="1" ${value==='1'?'selected':''}>一壘</option><option value="2" ${value==='2'?'selected':''}>二壘</option><option value="3" ${value==='3'?'selected':''}>三壘</option><option value="H" ${value==='H'?'selected':''}>回本壘得分</option><option value="O" ${value==='O'?'selected':''}>出局</option>`;}
function erSelect(value='pending'){return `<option value="pending" ${value==='pending'?'selected':''}>待判定</option><option value="yes" ${value==='yes'?'selected':''}>是自責分</option><option value="no" ${value==='no'?'selected':''}>非自責分</option>`;}
function moveRow(key,label,dest,er='pending'){return `<div class="movegrid"><b class="small">${esc(label)}</b><div class="field"><select data-move="${key}" aria-label="${esc(label)} 跑壘結果">${selectDest(dest)}</select></div><div class="field"><select data-er="${key}" aria-label="${esc(label)} 自責分">${erSelect(er)}</select></div></div>`;}
function movesNote(){return `<div class="small muted" style="margin:7px 0">僅「回本壘得分」者需選擇自責分；其他人選項會被忽略。若有複雜得分，請由紀錄員依判決調整。</div>`;}
function defaultMoves(type){let x=g(),r={};for(let i=0;i<3;i++){if(x.bases[i])r['r'+i]=String(i+1);}let bat='O';switch(type){
case '1B':bat='1';if(x.bases[2])r.r2='H';if(x.bases[1])r.r1='3';if(x.bases[0])r.r0='2';break;
case '2B':bat='2';if(x.bases[2])r.r2='H';if(x.bases[1])r.r1='H';if(x.bases[0])r.r0='3';break;
case '3B':bat='3';for(let k in r)r[k]='H';break;
case 'HR':bat='H';for(let k in r)r[k]='H';break;
case 'BB':case 'IBB':case 'HBP':bat='1';if(x.bases[0]){r.r0='2';if(x.bases[1]){r.r1='3';if(x.bases[2])r.r2='H';}}break;
case 'ROE':bat='1';if(x.bases[2])r.r2='H';if(x.bases[1])r.r1='3';if(x.bases[0])r.r0='2';break;
case 'SF':bat='O';if(x.bases[2])r.r2='H';break;
case 'SH':bat='O';if(x.bases[2])r.r2='H';if(x.bases[1])r.r1='3';if(x.bases[0])r.r0='2';break;
case 'FC':bat='1';if(x.bases[0])r.r0='O';else if(x.bases[1])r.r1='O';else if(x.bases[2])r.r2='O';break;
case 'DP':bat='O';if(x.bases[0])r.r0='O';else if(x.bases[1])r.r1='O';else if(x.bases[2])r.r2='O';break;
}r.bat=bat;return r;}
function playOpen(type){let x=g();if(x.finished)return;let atk=currentTeam(),def=x[defKey()],bat=nextBatter(),moves=defaultMoves(type);let rows=[0,1,2].filter(i=>x.bases[i]).map(i=>moveRow('r'+i,`${i+1}壘 ${pn(atk,x.bases[i].pid)}`,moves['r'+i])).join('');rows+=moveRow('bat',`打者 ${pn(atk,bat)}`,moves.bat);let runDefault=type==='HR'?1+ x.bases.filter(Boolean).length:type==='SF'&&x.bases[2]?1:type==='SH'?0:(['1B','2B','3B'].includes(type)?Object.values(moves).filter(v=>v==='H').length:0);
let errorField=type==='ROE'?`<div class="field" style="margin:10px 0"><label>造成失誤的守備員（可不指定球員）</label><select id="errorFielder">${selectOptions(def,'',true)}</select></div>`:'';
showModal(`<h2>確認 ${resultNames[type]}（${type}）</h2><div class="notice blue">${activeMark()} · ${pn(atk,bat)} 打擊 · 投手 ${pn(def,def.pitcher)}</div><div class="movegrid"><span class="small muted">跑者</span><span class="small muted">結果</span><span class="small muted">自責分 ER</span></div>${rows}${movesNote()}<div class="minirow"><div class="field"><label>本打席打點 RBI（可改）</label><input id="rbi" type="number" min="0" max="4" value="${runDefault}"></div><div class="field"><label>守備記號（選填）</label><input id="playCode" placeholder="例如 6-3、F8、E5" maxlength="30"></div></div>${errorField}<div class="field" style="margin-top:9px"><label>備註</label><input id="playNote" maxlength="100" placeholder="例如：左外野方向安打"></div><div class="modalFooter"><button class="btn" id="cancelModal">取消</button><button class="btn orange" data-commitplay="${type}">確認，寫入比賽</button></div>`);}
function getMoves(){let o={};document.querySelectorAll('[data-move]').forEach(el=>{let key=el.getAttribute('data-move');o[key]={dest:el.value,er:document.querySelector(`[data-er="${key}"]`)?.value||'pending'};});return o;}
function validateMoves(map,hasBatter){let x=g(),used=new Set(),outs=0,scored=0;for(let [key,ob] of Object.entries(map)){let v=ob.dest;if(/^[123]$/.test(v)){if(used.has(v))throw Error('同一個壘包不能同時站兩名跑者，請調整進壘結果。');used.add(v);let pos=key==='bat'?0:Number(key.slice(1))+1;if(Number(v)<pos)throw Error('跑者不能往回退壘，請修正進壘結果。');}if(v==='O')outs++;if(v==='H')scored++;}if(x.outs+outs>3)throw Error(`目前已有 ${x.outs} 出局，本次操作不能再產生 ${outs} 個出局數。`);if(x.outs+outs===3&&scored){if(!confirm('這個事件同時達成三出局與得分。請確認依棒球規則該得分確實有效（例如非封殺第三出局）。確定仍要計分？'))throw Error('已取消寫入，請重新確認。');}return {outs,scored};}
function applyMoves(map,batterId=null){let x=g(),k=offKey(),def=x[defKey()],atk=x[k],defPitch=def.pitcher,old=x.bases.slice(),newBases=[null,null,null],runs=[];let entrants={};for(let i=0;i<3;i++){if(old[i])entrants['r'+i]=old[i];}if(batterId)entrants.bat={pid:batterId,charge:defPitch,chargeSession:activePitchSession(def).id,by:'bat'};
for(let key in entrants){let e=entrants[key],move=map[key];if(!move)continue;let v=move.dest;if(v==='H')runs.push({runner:e,er:move.er});else if(v==='O'){}else newBases[Number(v)-1]=e;}
x.bases=newBases;for(let it of runs){st(atk,it.runner.pid).R++;x.score[k][x.inning-1]++;pitchCredit(def,it.runner.charge,'R',1,it.runner.chargeSession);if(it.er==='yes')pitchCredit(def,it.runner.charge,'ER',1,it.runner.chargeSession);else if(it.er!=='no')pitchCredit(def,it.runner.charge,'pendingER',1,it.runner.chargeSession);}return runs.length;}
function commitPlay(type){let x=g(),atk=currentTeam(),def=x[defKey()],bid=nextBatter(),map=getMoves();let m;try{m=validateMoves(map,true);}catch(e){alertText(e.message);return;}let rbi=n(document.getElementById('rbi').value),code=document.getElementById('playCode').value.trim(),note=document.getElementById('playNote').value.trim();if(rbi<0||rbi>m.scored){alertText('打點 RBI 不能多於本打席實際得分人數，請修改。');return;}if(type==='HR'&&map.bat.dest!=='H'&&!confirm('全壘打的打者沒有回本壘，仍要這樣紀錄？'))return;if(type==='SF'&&x.outs>=2){alertText('兩出局時不能成立高飛犧牲打，請改用一般出局。');return;}if(type==='DP'&&m.outs!==2&&!confirm('雙殺打本次並非兩個出局數，確定仍要記錄 DP？'))return;
let fielder=document.getElementById('errorFielder')?.value||'',pitcher=def.pitcher; snapshot();let b=st(atk,bid),p=ps(def,pitcher);b.PA++;pitchCredit(def,pitcher,'BF');let ab=!['BB','IBB','HBP','SF','SH'].includes(type);if(ab)b.AB++;if(['1B','2B','3B','HR'].includes(type)){b.H++;if(type==='HR')b.HR++;else b['_'+type]++;pitchCredit(def,pitcher,'H');}
if(type==='BB'||type==='IBB'){b.BB++;if(type==='IBB')b.IBB++;pitchCredit(def,pitcher,'BB');}
if(type==='HBP'){b.HBP++;pitchCredit(def,pitcher,'HBP');}
if(type==='SO'){b.SO++;pitchCredit(def,pitcher,'SO');}if(type==='SF')b.SF++;if(type==='SH')b.SH++;if(type==='FC')b.FC++;if(type==='ROE'){b.ROE++;def.errors++;if(fielder)st(def,fielder).E++;}if(type==='DP')b.DP++;
b.RBI+=rbi;let runs=applyMoves(map,bid);pitchCredit(def,pitcher,'outs',m.outs);x.outs+=m.outs;atk.next=(atk.next+1)%9;x.balls=0;x.strikes=0;
log('pa',`${pn(atk,bid)}｜${resultNames[type]}`,`${code?code+' · ':''}${m.outs} 出局、${runs} 分、RBI ${rbi}${note?' · '+note:''}`);if(x.outs>=3)setHalf();modal=null;write();}
function runOpen(type){let x=g(),atk=currentTeam();if(!x.bases.some(Boolean)){alertText('目前壘上沒有人，無法記錄跑壘事件。');return;}let rows=[0,1,2].filter(i=>x.bases[i]).map(i=>{let v=type==='WP'||type==='PB'||type==='BK'?i===2?'H':String(i+2):String(i+1);if(type==='SB'){v=i===2?'H':String(i+2)}if(type==='CS'&&i===0)v='O';return moveRow('r'+i,`${i+1}壘 ${pn(atk,x.bases[i].pid)}`,v)}).join('');
let actorOptions=x.bases.map((v,i)=>v?`<option value="r${i}">${i+1}壘 ${esc(pn(atk,v.pid))}</option>`:'').join('');
showModal(`<h2>跑壘紀錄｜${ADV[type]}</h2><div class="notice blue">直接指定每位跑者的最終位置。已在同壘的跑者不可重疊。${type==='SB'?'請指定哪位球員盜壘成功。':''}</div><div class="movegrid"><span class="small muted">跑者</span><span class="small muted">最終位置</span><span class="small muted">自責分 ER</span></div>${rows}${movesNote()}${type==='SB'||type==='CS'?`<div class="field"><label>計入 ${type} 的球員</label><select id="runActor">${actorOptions}</select></div>`:''}<div class="field" style="margin-top:9px"><label>備註</label><input id="runNote" maxlength="100" placeholder="選填"></div><div class="modalFooter"><button class="btn" id="cancelModal">取消</button><button class="btn orange" data-commitrun="${type}">確認跑壘紀錄</button></div>`);}
function commitRun(type){let x=g(),k=offKey(),atk=x[k],def=x[defKey()],map=getMoves(),old=x.bases.slice();let check;try{check=validateMoves(map,false);}catch(e){alertText(e.message);return;}let act=document.getElementById('runActor')?.value;if((type==='SB'||type==='CS')&&(!act||!old[Number(act.slice(1))])){alertText('請選擇盜壘球員。');return;}if(type==='SB'&&map[act].dest===String(Number(act.slice(1))+1)){alertText('盜壘球員的壘包尚未變動，請更正。');return;}if(type==='CS'&&map[act].dest!=='O'){alertText('盜壘刺的球員結果必須是出局。');return;}
let changed=Object.entries(map).some(([key,v])=>v.dest!==String(Number(key.slice(1))+1));if(!changed){alertText('沒有任何跑者變更，請選擇實際進壘或出局結果。');return;}
snapshot();let runnerId=act?old[Number(act.slice(1))].pid:null;if(type==='SB')st(atk,runnerId).SB++;if(type==='CS')st(atk,runnerId).CS++;if(type==='WP')pitchCredit(def,def.pitcher,'WP');if(type==='BK')pitchCredit(def,def.pitcher,'BK');
let runs=applyMoves(map,null);pitchCredit(def,def.pitcher,'outs',check.outs);x.outs+=check.outs;let note=document.getElementById('runNote')?.value||'';log('run',`${ADV[type]}${runnerId?'｜'+pn(atk,runnerId):''}`,`${check.outs} 出局、${runs} 分${note?' · '+note:''}`);if(x.outs>=3)setHalf();modal=null;write();}
function subOpen(k,slot){let x=g(),t=x[k];if(x.finished)return;let available=t.roster.filter(p=>p.id===t.lineup[slot]||!t.lineup.includes(p.id));showModal(`<h2>換人｜${esc(t.name)}</h2><div class="notice blue">第 ${slot+1} 棒：${esc(pn(t,t.lineup[slot]))}。允許同一球員下場後再上場，舊成績會保留在個人名下。</div><div class="field"><label>更換上場的球員</label><select id="newSub">${available.map(p=>`<option value="${p.id}" ${p.id===t.lineup[slot]?'selected':''}>${esc(pn(t,p.id))}</option>`).join('')}</select></div><div class="modalFooter"><button class="btn" id="cancelModal">取消</button><button class="btn orange" data-confirmsub="${k}:${slot}">確認換人</button></div>`);}
function pitcherOpen(k){let x=g(),t=x[k];if(x.finished)return;showModal(`<h2>更換投手｜${esc(t.name)}</h2><div class="notice blue">原投手 ${esc(pn(t,t.pitcher))} 的成績將保留。回到投手丘時會建立「當日二次登板／第 N 次登板」獨立紀錄；單場數據可選擇分開或合併。</div><div class="field"><label>下一任投手</label><select id="newPitcher">${selectOptions(t,t.pitcher)}</select></div><div class="small muted" style="margin-top:8px">若正進行同一打席的投手更替，本版將打席結果 BF 歸給最後完成打席的投手；建議避免在尚未結束的打席中操作換投。</div><div class="modalFooter"><button class="btn" id="cancelModal">取消</button><button class="btn orange" data-confirmpitcher="${k}">確認換投</button></div>`);}
function fieldingOpen(){let x=g(),k=defKey(),t=x[k];showModal(`<h2>補登守備紀錄｜${esc(t.name)}</h2><div class="notice blue">補登 PO（刺殺）、A（助殺）、E（失誤），不會再次增加出局數。如果打席結果已經選擇 ROE，失誤數也已登錄，請勿重複補 E。</div><div class="field"><label>守備球員</label><select id="fielder">${selectOptions(t,'')}</select></div><div class="grid g3" style="margin-top:12px"><div class="field"><label>PO 刺殺</label><input type="number" id="po" min="0" max="3" value="0"></div><div class="field"><label>A 助殺</label><input type="number" id="assist" min="0" max="5" value="0"></div><div class="field"><label>E 失誤</label><input type="number" id="error" min="0" max="3" value="0"></div></div><div class="field"><label>守備紀錄（例如 6-3）</label><input id="fieldNote" maxlength="60"></div><div class="modalFooter"><button class="btn" id="cancelModal">取消</button><button class="btn orange" id="confirmFielding">補登守備數據</button></div>`);}

if(el.dataset.positionSlot!==undefined){const i=Number(el.dataset.positionSlot),pid=db.draft.lineup[i],newpos=el.value;if(!pid)return;const old=db.draft.positions[pid],other=db.draft.lineup.find(id=>id!==pid&&db.draft.positions[id]===newpos);db.draft.positions[pid]=newpos;if(other)db.draft.positions[other]=old;write();return;}
if(el.id==='draftDate'){db.draft.date=el.value;save();render();return;}
if(el.id==='draftOpponent'){db.draft.opponent=el.value.trim();save();render();return;}
if(el.id==='draftSide'){db.draft.side=el.value;write();return;}
if(el.id==='clubImport'&&el.files?.[0]){try{await importClubRoster(await el.files[0].text());}catch(err){alertText('名冊匯入失敗：'+err.message)}return;}
if(e.target.id==='importJSON'&&e.target.files?.[0]){await importJSONFile(e.target.files[0]);e.target.value='';}if(e.target.id==='logoUpload'&&e.target.files?.[0]){let file=e.target.files[0];if(file.size>5000000){alertText('Logo 請使用 5MB 以下圖片。');return;}try{let img=new Image(),u=URL.createObjectURL(file);img.src=u;await img.decode();let canvas=document.createElement('canvas'),max=340,ratio=Math.min(max/img.width,max/img.height,1);canvas.width=Math.max(1,Math.round(img.width*ratio));canvas.height=Math.max(1,Math.round(img.height*ratio));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);URL.revokeObjectURL(u);db.logo=canvas.toDataURL('image/png');write();}catch{alertText('讀取 Logo 失敗。請使用 PNG／JPG／WEBP 圖片。');}}if(e.target.id==='fontScale'){db.settings.scale=Number(e.target.value)||1;write();}});}
attachEvents();render();if('serviceWorker'in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){navigator.serviceWorker.register('./sw.js').catch(()=>{});}
// Tests may inspect export-only internals; not needed for operating the application.
window.__TRDebug={getState:()=>deep(db),getGame:()=>deep(g()),getUndoCount:()=>undoStack.length,getRoster:()=>deep(db.clubRoster),getDraft:()=>deep(db.draft),navigate:navigate};
})();
