<body>
<header><div class="inner"><div class="brand"><div id="logo" class="logo"><img src="./logo-tianrui.png" alt="天睿隊徽"></div><div><strong>天睿教育棒球隊</strong><small>單場紀錄系統 · 離線版 v1.1.1</small></div></div><span class="subtag">無需網路即可紀錄</span></div></header>
<main class="app" id="app"></main><div id="modalhost"></div>
<script>
'use strict';
(function(){
const KEY='TR_BASEBALL_OFFLINE_V1';
const resultNames={"1B":"一壘安打","2B":"二壘安打","3B":"三壘安打","HR":"全壘打","BB":"四壞保送","IBB":"故意四壞","HBP":"觸身球","SO":"三振","GO":"滾地出局","FO":"飛球出局","SF":"高飛犧牲打","SH":"犧牲觸擊","FC":"野手選擇","ROE":"失誤上壘","DP":"雙殺打"};
const ADV={SB:'盜壘',CS:'盜壘刺',WP:'暴投',PB:'捕逸',BK:'投手犯規',ADV:'其他進壘／跑壘'};
const n=(v)=>Number(v)||0;const uid=()=>('id_'+Math.random().toString(36).slice(2,10)+Date.now().toString(36));
const esc=(v)=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=(x,d=3)=>Number.isFinite(x)?x.toFixed(d):'—';
const deep=x=>JSON.parse(JSON.stringify(x));
const teamKeys=['away','home'];
function blankBat(){return {PA:0,AB:0,H:0,_1B:0,_2B:0,_3B:0,HR:0,BB:0,IBB:0,HBP:0,SO:0,SF:0,SH:0,FC:0,ROE:0,DP:0,R:0,RBI:0,SB:0,CS:0,PO:0,A:0,E:0};}
function blankPitch(){return {BF:0,outs:0,H:0,BB:0,HBP:0,SO:0,R:0,ER:0,pendingER:0,pitches:0,WP:0,BK:0};}
function defaultTeam(name,prefix){let roster=Array.from({length:12},(_,i)=>({id:uid(),num:String(i+1).padStart(2,'0'),name:(prefix==='TR'?'天睿球員':'對手球員')+' '+String(i+1).padStart(2,'0')}));let first={id:uid(),pid:roster[0].id,ordinal:1,startedAt:new Date().toISOString(),stats:blankPitch()};return {name,roster,lineup:roster.slice(0,9).map(x=>x.id),pitcher:roster[0].id,defense:{P:roster[0].id,C:'',B1:'',B2:'',B3:'',SS:'',LF:'',CF:'',RF:''},next:0,stats:{},pitchStats:{},pitchSessions:[first],activeSessionId:first.id,errors:0};}
function freshGame(side,opp,date){const away=side==='away'?defaultTeam('天睿教育棒球隊','TR'):defaultTeam(opp,'OP');const home=side==='home'?defaultTeam('天睿教育棒球隊','TR'):defaultTeam(opp,'OP');let g={id:uid(),date:date||new Date().toISOString().slice(0,10),away,home,side,inning:1,half:'top',outs:0,bases:[null,null,null],balls:0,strikes:0,score:{away:[0,...Array(8).fill(null)],home:Array(9).fill(null)},events:[],finished:false,createdAt:Date.now(),completedAt:null,note:''};for(let k of teamKeys){for(let p of g[k].roster){g[k].stats[p.id]=blankBat();g[k].pitchStats[p.id]=blankPitch();}}return g;}
let db;try{db=JSON.parse(localStorage.getItem(KEY)||'null');}catch{}if(!db||!Array.isArray(db.games))db={games:[],activeId:null,logo:null,settings:{scale:1}};
if(!db.settings)db.settings={scale:1};if(!['split','combined'].includes(db.settings.pitchView))db.settings.pitchView='split';let tab='record',statTeam='away',editTeam='away',modal=null,undoStack=[],futureStack=[],saveError='',tempCount=0,previewURL=null;
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));saveError='';}catch(e){saveError='瀏覽器儲存失敗，請立即匯出 JSON 備份。可能已達儲存容量上限。';}}
function g(){return db.games.find(x=>x.id===db.activeId)||null;}
function st(t,id){if(!t.stats[id])t.stats[id]=blankBat();return t.stats[id];}
function ps(t,id){if(!t.pitchStats[id])t.pitchStats[id]=blankPitch();return t.pitchStats[id];}
// 每一任投手擁有獨立登板段。保留舊版彙總欄位供備份及單場合計使用。
function newPitchSession(t,pid){if(!Array.isArray(t.pitchSessions))t.pitchSessions=[];let session={id:uid(),pid,ordinal:t.pitchSessions.filter(x=>x.pid===pid).length+1,startedAt:new Date().toISOString(),stats:blankPitch()};t.pitchSessions.push(session);t.activeSessionId=session.id;return session;}
function normalizePitchSessions(t){if(!Array.isArray(t.pitchSessions)){t.pitchSessions=[];for(let [pid,old] of Object.entries(t.pitchStats||{})){if(Object.values(old||{}).some(v=>Number(v)>0))t.pitchSessions.push({id:uid(),pid,ordinal:1,startedAt:null,legacy:true,stats:{...blankPitch(),...old}});}let active=t.pitchSessions.filter(x=>x.pid===t.pitcher).at(-1);if(active)t.activeSessionId=active.id;else newPitchSession(t,t.pitcher);}if(!t.pitchSessions.some(x=>x.id===t.activeSessionId&&x.pid===t.pitcher)){let last=t.pitchSessions.filter(x=>x.pid===t.pitcher).at(-1);if(last)t.activeSessionId=last.id;else newPitchSession(t,t.pitcher);}for(let ss of t.pitchSessions)ss.stats={...blankPitch(),...(ss.stats||{})};}
for(let game of db.games)for(let key of teamKeys)if(game[key])normalizePitchSessions(game[key]);
function activePitchSession(t){normalizePitchSessions(t);return t.pitchSessions.find(s=>s.id===t.activeSessionId);}
function pitchCredit(t,pid,key,amount=1,sessionId=null){ps(t,pid)[key]+=amount;normalizePitchSessions(t);let sess=(sessionId?t.pitchSessions.find(s=>s.id===sessionId&&s.pid===pid):null)||t.pitchSessions.find(s=>s.id===t.activeSessionId&&s.pid===pid)||t.pitchSessions.filter(s=>s.pid===pid).at(-1);if(sess)sess.stats[key]+=amount;}
function pitchName(t,s){let label=s.ordinal===1?'第 1 次登板':s.ordinal===2?'當日二次登板':`當日第 ${s.ordinal} 次登板`;return `${pn(t,s.pid)}（${label}${s.legacy?'／舊版合計':''}）`;}
function pitchRowsData(t){normalizePitchSessions(t);if(db.settings.pitchView==='combined'){return t.roster.filter(p=>{let z=ps(t,p.id);return z.BF||z.outs||z.pitches||z.R||z.H}).map(p=>({name:pn(t,p.id)+'（合併）',stats:ps(t,p.id)}));}return t.pitchSessions.filter(s=>{let z=s.stats;return z.BF||z.outs||z.pitches||z.R||z.H||z.BB||z.SO||s.ordinal>1}).map(s=>({name:pitchName(t,s),stats:s.stats}));}
function player(t,id){return t.roster.find(x=>x.id===id)||{name:'未知球員',num:'?'};}
function pn(t,id){let p=player(t,id);return `#${p.num} ${p.name}`;}
function offKey(){return g().half==='top'?'away':'home';}function defKey(){return g().half==='top'?'home':'away';}
function sum(a){return a.reduce((s,x)=>s+n(x),0)}
function scores(){let x=g();return {away:sum(x.score.away),home:sum(x.score.home)};}
function snapshot(){let cur=g();if(!cur)return;undoStack.push(deep(cur));if(undoStack.length>25)undoStack.shift();futureStack=[];}
function write(){save();render();}
function log(kind,message,desc=''){let x=g();x.events.push({id:uid(),time:new Date().toISOString(),inning:x.inning,half:x.half,kind,message,desc});}
function navigate(t){tab=t;modal=null;render();window.scrollTo({top:0,behavior:'instant'});}
function alertText(t){window.alert(t);}
function currentTeam(){return g()[offKey()];}
function nextBatter(){let t=currentTeam();return t.lineup[t.next];}
function teamOfSide(){return g()[g().side];}
function activeMark(){let x=g();return `${x.inning}局${x.half==='top'?'上':'下'}半`;}
function totalInning(k){return sum(g().score[k]);}
function setHalf(){let x=g();if(x.inning>=9&&x.half==='top'&&totalInning('home')>totalInning('away')){x.finished=true;x.completedAt=Date.now();log('game','九局上結束，主隊領先，結束比賽');return;}
 if(x.half==='top'){x.half='bottom';x.score.home[x.inning-1]=0;}else if(x.inning===9){x.finished=true;x.completedAt=Date.now();log('game','第九局結束，結束比賽');return;}else{x.inning++;x.half='top';x.score.away[x.inning-1]=0;}
 x.outs=0;x.bases=[null,null,null];x.balls=0;x.strikes=0;log('half',`進入 ${activeMark()}`);
}
function inningsBoard(){let x=g(),sc=scores();let th='<th>隊伍</th>'+Array.from({length:9},(_,i)=>`<th>${i+1}</th>`).join('')+'<th class="total">R</th><th class="total">H</th><th class="total">E</th>';
let rows=teamKeys.map(k=>{let t=x[k],hits=t.roster.reduce((z,p)=>z+n(st(t,p.id).H),0);return `<tr><td>${esc(t.name)}<span class="tiny muted"> ${k==='away'?'客／上':'主／下'}</span></td>${x.score[k].map((v,i)=>`<td class="${!x.finished&&x.inning===i+1&&offKey()===k?'current':''}">${v===null?'·':v}</td>`).join('')}<td class="total">${sc[k]}</td><td class="total">${hits}</td><td class="total">${t.errors}</td></tr>`}).join('');return `<div class="card"><div class="scorehead"><div class="center"><div class="teamName">${esc(x.away.name)}</div><div class="bigScore num">${sc.away}</div><span class="tiny muted">客隊</span></div><div class="center"><span class="vs">VS</span><div class="pill ${x.finished?'orange':''}" style="margin-top:5px">${x.finished?'已結束':activeMark()}</div></div><div class="center"><div class="teamName">${esc(x.home.name)}</div><div class="bigScore num">${sc.home}</div><span class="tiny muted">主隊</span></div></div><div class="scroller" style="margin-top:15px"><table class="scoretable"><thead><tr>${th}</tr></thead><tbody>${rows}</tbody></table></div><div class="row between" style="margin-top:9px"><span class="small muted">${esc(x.date)} · ${x.finished?'比賽結束':'進行中'} · 最多顯示第 1～9 局</span><span class="small muted">R 得分 · H 安打 · E 失誤</span></div></div>`;}
function baseSVG(){let x=g(),bat=currentTeam(),b=x.bases;let position=(idx)=>b[idx]?`<div class="baseLabel on b${idx+1}">${esc(pn(bat,b[idx].pid))}</div>`:`<div class="baseLabel b${idx+1}">${idx+1} 壘</div>`;
return `<div class="diamondArea"><div class="diamond"><svg viewBox="0 0 166 142"><path d="M83 14 L151 75 L83 132 L15 75 Z" fill="#eaf3ed" stroke="#648d77" stroke-width="3"/><path d="M83 14 L151 75 L83 132 L15 75 Z" fill="none" stroke="#fff" stroke-width="2"/><path d="M83 14 L151 75 L83 132 L15 75 Z" fill="none" stroke="#becdc0" stroke-width="1"/><path d="M83 118 L93 127 L83 137 L73 127Z" fill="#d9e4ed" stroke="#66829a"/></svg>${position(0)}${position(1)}${position(2)}<div class="baseLabel homeplate">本壘</div></div></div>`;}
function selectOptions(t,chosen,none=false){return (none?'<option value="">— 請選擇 —</option>':'')+t.roster.map(p=>`<option value="${p.id}" ${p.id===chosen?'selected':''}>${esc(pn(t,p.id))}</option>`).join('');}
function appShell(content){let x=g();return `<nav><button class="${tab==='record'?'active':''}" data-tab="record">⚾ 場邊紀錄</button><button class="${tab==='stats'?'active':''}" data-tab="stats">📊 單場數據</button><button class="${tab==='lineup'?'active':''}" data-tab="lineup">👕 球員／換人</button><button class="${tab==='history'?'active':''}" data-tab="history">🕘 操作紀錄</button><button class="${tab==='files'?'active':''}" data-tab="files">📤 匯出／設定</button><button data-tab="home">全部比賽</button></nav>${saveError?`<div class="notice red">${esc(saveError)}</div>`:''}${x?inningsBoard():''}${content}<div class="footer">天睿教育棒球隊 · 本機離線紀錄 · 每場結束請備份 JSON</div>`;}
function homePage(){let cards=db.games.slice().sort((a,b)=>b.createdAt-a.createdAt).map(x=>{let aa=sum(x.score.away),hh=sum(x.score.home);return `<div class="card"><div class="row between"><div><b>${esc(x.away.name)} ${aa} : ${hh} ${esc(x.home.name)}</b><div class="small muted">${esc(x.date)} · ${x.finished?'已結束':'進行中'} · ${x.inning}局${x.half==='top'?'上':'下'}</div></div><button class="btn small primary" data-open="${x.id}">開啟</button></div></div>`}).join('');return `<div class="card"><h1>建立比賽</h1><p class="muted">使用手機或平板操作。無需登入，全部資料保存在目前裝置與瀏覽器內。</p><div class="grid g2"><div class="field"><label>對手隊名</label><input id="newOpponent" value="對手球隊" maxlength="40"></div><div class="field"><label>比賽日期</label><input id="newDate" type="date" value="${new Date().toISOString().slice(0,10)}"></div></div><div style="height:10px"></div><div class="field"><label>天睿的主客場</label><select id="newSide"><option value="home">天睿為主隊（先守備／後攻）</option><option value="away">天睿為客隊（先攻擊）</option></select></div><div class="notice blue" style="margin-top:12px">先用預設球員佔位，建立後請到「球員／換人」修改真實姓名、背號與九人打序。這些佔位名並非球隊正式名單。</div><button class="btn orange" id="createGame" style="width:100%">建立單場比賽</button></div><h2>已保存的比賽</h2>${cards||'<div class="empty"><strong>目前還沒有比賽</strong>建立後會自動保存在這台裝置。</div>'}<div class="notice">重要：清除瀏覽器網站資料、使用無痕模式或換裝置，可能遺失紀錄。請每場匯出 JSON 檔保存。</div>`;}
function recordPage(){let x=g(),atk=currentTeam(),def=x[defKey()],b=player(atk,nextBatter()),p=player(def,def.pitcher),bs=st(atk,b.id),pp=ps(def,p.id),occupied=x.bases.filter(Boolean).length;
let actions=[["1B","hit"],["2B","hit"],["3B","hit"],["HR","hit"],["BB",""],["IBB",""],["HBP",""],["SO","out"],["GO","out"],["FO","out"],["SF","out"],["SH","out"],["FC",""],["ROE",""],["DP","out"]];
let ab=actions.map(([k,c])=>`<button class="${c}" data-result="${k}" ${x.finished?'disabled':''}>${k}<span>${resultNames[k]}</span></button>`).join('');
return `<div class="split"><section><div class="card"><div class="section-title"><h2>目前攻守與跑壘</h2><span class="pill">${x.finished?'比賽已結束':esc(atk.name)+' 攻擊'}</span></div><div class="liveTop"><div><div class="small muted">第 ${atk.next+1} 棒 · 目前打者</div><div class="batter">${esc(pn(atk,b.id))}</div><div class="statRow"><span>AB <b>${bs.AB}</b></span><span>H <b>${bs.H}</b></span><span>RBI <b>${bs.RBI}</b></span><span>AVG <b>${bs.AB?fmt(bs.H/bs.AB):'—'}</b></span></div><div class="small muted" style="margin-top:11px">投手：${esc(pn(def,p.id))}</div><div class="statRow"><span>本次 IP <b>${Math.floor(activePitchSession(def).stats.outs/3)}.${activePitchSession(def).stats.outs%3}</b></span><span>本次 SO <b>${activePitchSession(def).stats.SO}</b></span><span>本次球數 <b>${activePitchSession(def).stats.pitches}</b></span></div><div class="tiny muted" style="margin-top:6px">${esc(pitchName(def,activePitchSession(def)))} · 當日合計 ${Math.floor(pp.outs/3)}.${pp.outs%3} IP</div></div><div class="center"><div class="small muted">出局</div><div class="outs">${[0,1,2].map(i=>`<div class="outdot ${i<x.outs?'on':''}"></div>`).join('')}</div><div class="small muted" style="margin-top:5px">${x.outs} OUT</div></div></div>${baseSVG()}<div class="row between"><span class="small muted">壘上 ${occupied} 人</span><span class="small muted">B ${x.balls} · S ${x.strikes} · O ${x.outs}</span></div></div><div class="card"><div class="section-title"><h2>本打席投球記錄（選用）</h2><span class="small muted">已投 ${pp.pitches} 球</span></div><div class="grid g3"><button class="btn pitchbutton" data-pitch="B" ${x.finished?'disabled':''}>+ 壞球 B</button><button class="btn pitchbutton" data-pitch="S" ${x.finished?'disabled':''}>+ 好球 S</button><button class="btn pitchbutton" data-pitch="F" ${x.finished?'disabled':''}>+ 界外 F</button></div><div class="small muted" style="margin-top:8px">不逐球記也能記打席，但投球數會不完整。第四壞球／第三好球請再選擇下方打席結果。</div></div><div class="card"><h2>記錄打席結果</h2><div class="actiongrid">${ab}</div><div class="small muted" style="margin-top:10px">選擇結果後，會先顯示各跑者進壘與自責分確認，可修改後才正式寫入。</div></div></section><aside><div class="card"><div class="section-title"><h2>特殊事件</h2><span class="pill orange">乙組彈性換人</span></div><div class="grid g2"><button class="btn" data-run="ADV" ${x.finished?'disabled':''}>跑壘／進壘</button><button class="btn" data-run="SB" ${x.finished?'disabled':''}>盜壘</button><button class="btn" data-run="CS" ${x.finished?'disabled':''}>盜壘刺</button><button class="btn" data-run="WP" ${x.finished?'disabled':''}>暴投</button><button class="btn" data-run="PB" ${x.finished?'disabled':''}>捕逸</button><button class="btn" data-run="BK" ${x.finished?'disabled':''}>投手犯規</button><button class="btn" id="substitute" ${x.finished?'disabled':''}>打序換人</button><button class="btn" id="pitcherChange" ${x.finished?'disabled':''}>更換投手</button><button class="btn" id="fielding" ${x.finished?'disabled':''}>補登守備</button><button class="btn" id="manualHalf" ${x.finished?'disabled':''}>手動換半局</button></div><div class="divider"></div><div class="row"><button class="btn ghost" id="undo" ${!undoStack.length?'disabled':''}>↶ 復原</button><button class="btn ghost" id="redo" ${!futureStack.length?'disabled':''}>↷ 重做</button><button class="btn danger" id="finish" ${x.finished?'disabled':''}>結束比賽</button></div><div class="small muted" style="margin-top:9px">時間到可直接結束，不必完成 9 局。跑者留壘與未完成半局會原樣保留。</div></div><div class="card"><h2>打序速覽</h2>${atk.lineup.map((id,i)=>`<div class="lineuprow"><span class="slot">${i+1}</span><span class="who ${i===atk.next?'current':''}">${esc(pn(atk,id))}</span>${i===atk.next?'<span class="pill orange">打擊中</span>':''}</div>`).join('')}</div></aside></div>`;}
function battingRows(t){let rr=t.roster.filter(p=>{let z=st(t,p.id);return z.PA||z.PO||z.A||z.E||z.SB||z.CS;});if(!rr.length)return '<tr><td colspan="14" class="muted">尚無紀錄</td></tr>';return rr.map(p=>{let z=st(t,p.id),obden=z.AB+z.BB+z.HBP+z.SF,avg=z.AB?fmt(z.H/z.AB):'—',ob=obden?fmt((z.H+z.BB+z.HBP)/obden):'—',slg=z.AB?fmt((z._1B+2*z._2B+3*z._3B+4*z.HR)/z.AB):'—',ops=(z.AB&&obden)?fmt((z.H+z.BB+z.HBP)/obden+(z._1B+2*z._2B+3*z._3B+4*z.HR)/z.AB):'—';return `<tr><td>${esc(pn(t,p.id))}</td><td>${z.PA}</td><td>${z.AB}</td><td>${z.H}</td><td>${z.R}</td><td>${z.RBI}</td><td>${z.BB}</td><td>${z.SO}</td><td>${z._2B}</td><td>${z._3B}</td><td>${z.HR}</td><td class="statStrong">${avg}</td><td class="statStrong">${ob}</td><td class="statStrong">${slg}</td><td class="statStrong">${ops}</td></tr>`;}).join('');}
function pitchingRows(t){let rr=pitchRowsData(t);if(!rr.length)return '<tr><td colspan="13" class="muted">尚無投球紀錄</td></tr>';return rr.map(({name,stats:z})=>{let ip=Math.floor(z.outs/3)+'.'+z.outs%3,era=z.pendingER?'待判':z.outs?fmt(z.ER*27/z.outs,2):'—',whip=z.outs?fmt((z.BB+z.H)*3/z.outs,2):'—';return `<tr><td>${esc(name)}</td><td>${ip}</td><td>${z.BF}</td><td>${z.H}</td><td>${z.BB}</td><td>${z.HBP}</td><td>${z.SO}</td><td>${z.R}</td><td>${z.ER}${z.pendingER?` (+${z.pendingER}待判)`:''}</td><td>${z.pitches}</td><td>${z.WP}</td><td class="statStrong">${era}</td><td class="statStrong">${whip}</td></tr>`;}).join('');}
function statsPage(){let x=g(),t=x[statTeam],rows=t.roster.filter(p=>{let z=st(t,p.id);return z.PA||z.PO||z.A||z.E||z.SB||z.CS;}).map(p=>{let z=st(t,p.id),c=z.PO+z.A+z.E;return `<tr><td>${esc(pn(t,p.id))}</td><td>${z.PO}</td><td>${z.A}</td><td>${z.E}</td><td class="statStrong">${c?fmt((z.PO+z.A)/c):'—'}</td><td>${z.SB}</td><td>${z.CS}</td></tr>`;}).join('');return `<div class="card"><div class="section-title"><h2>單場球員數據</h2><span class="pill orange">${x.finished?'最終':'即時'}</span></div><div class="tabs"><button class="btn ${statTeam==='away'?'sel':''}" data-statteam="away">客隊 ${esc(x.away.name)}</button><button class="btn ${statTeam==='home'?'sel':''}" data-statteam="home">主隊 ${esc(x.home.name)}</button></div><h3>打擊</h3><div class="scroller"><table class="table"><thead><tr><th>球員</th><th>PA</th><th>AB</th><th>H</th><th>R</th><th>RBI</th><th>BB</th><th>SO</th><th>2B</th><th>3B</th><th>HR</th><th>AVG</th><th>OBP</th><th>SLG</th><th>OPS</th></tr></thead><tbody>${battingRows(t)}</tbody></table></div><div class="divider"></div><h3>投手</h3><div class="tabs"><button class="btn ${db.settings.pitchView==='split'?'sel':''}" data-pitchview="split">分次登板</button><button class="btn ${db.settings.pitchView==='combined'?'sel':''}" data-pitchview="combined">當日合併</button></div><div class="scroller"><table class="table"><thead><tr><th>球員</th><th>IP</th><th>BF</th><th>H</th><th>BB</th><th>HBP</th><th>SO</th><th>R</th><th>ER</th><th>球數</th><th>WP</th><th>ERA</th><th>WHIP</th></tr></thead><tbody>${pitchingRows(t)}</tbody></table></div><div class="divider"></div><h3>守備／跑壘</h3><div class="scroller"><table class="table"><thead><tr><th>球員</th><th>PO</th><th>A</th><th>E</th><th>守備率</th><th>SB</th><th>CS</th></tr></thead><tbody>${rows||'<tr><td colspan="7" class="muted">尚無紀錄</td></tr>'}</tbody></table></div></div><div class="notice blue">打擊率 AVG = H/AB；上壘率 OBP = (H+BB+HBP)/(AB+BB+HBP+SF)；長打率 SLG = TB/AB。單場數據僅供比賽參考。防禦率 ERA 採 9 局換算（ER×27／投手出局數），無自責分判定或 0 出局數時不顯示可比較數值。守備 PO/A 必須由紀錄員補登。</div>`;}
function lineupPage(){let x=g(),t=x[editTeam];return `<div class="card"><div class="section-title"><h2>球員名單與打序</h2><span class="pill">9 人固定打序 · 可重返</span></div><div class="tabs"><button class="btn ${editTeam==='away'?'sel':''}" data-editteam="away">客隊</button><button class="btn ${editTeam==='home'?'sel':''}" data-editteam="home">主隊</button></div><div class="field"><label>隊伍名稱</label><div class="row"><input class="edit grow" id="teamName" value="${esc(t.name)}" maxlength="45"><button class="btn small primary" id="saveTeamName">更新隊名</button></div></div><div class="divider"></div><h3>現役名單（最多 40 人）</h3><div id="rosterFields">${t.roster.map((p,i)=>`<div class="frow"><input aria-label="球員背號" data-num="${p.id}" value="${esc(p.num)}" maxlength="5"><input aria-label="球員姓名" data-name="${p.id}" value="${esc(p.name)}" maxlength="32"><button aria-label="移除球員" data-remove="${p.id}" ${t.roster.length<=9?'disabled':''}>×</button></div>`).join('')}</div><div class="row"><button class="btn small" id="addPlayer" ${t.roster.length>=40?'disabled':''}>＋ 新增球員</button><button class="btn small primary" id="saveRoster">儲存姓名／背號</button></div><div class="notice blue" style="margin-top:10px">更改球員姓名、背號不會清除已有成績。已有比賽紀錄的球員不能刪除；需要暫時退場請使用換人。</div><div class="divider"></div><h3>目前 1～9 棒</h3>${t.lineup.map((id,i)=>`<div class="lineuprow"><span class="slot">${i+1}</span><span class="who">${esc(pn(t,id))}</span>${!x.finished?`<button class="btn small" data-subslot="${i}">換人</button>`:'<span class="tiny muted">已結束</span>'}</div>`).join('')}<div class="divider"></div><h3>目前投手</h3><div class="row"><b>${esc(pitchName(t,activePitchSession(t)))}</b>${!x.finished?'<button class="btn small" id="changePitchTeam">更換投手</button>':''}</div><div class="small muted" style="margin-top:8px">每次換投都另開一筆登板紀錄。二次登板與首次登板分開計算，也能於「單場數據」切換當日合計；投手可再次登板或改守其他位置。</div><div class="divider"></div><h3>防守位置（可隨時調整）</h3>${[['P','投手'],['C','捕手'],['B1','一壘手'],['B2','二壘手'],['B3','三壘手'],['SS','游擊手'],['LF','左外野'],['CF','中外野'],['RF','右外野']].map(([key,name])=>`<div class="row" style="margin-bottom:7px;flex-wrap:nowrap"><label style="width:80px;margin:0;flex-shrink:0">${name}</label><select class="edit" data-def="${key}" ${key==='P'?'disabled':''}>${selectOptions(t,t.defense?.[key]||'',true)}</select></div>`).join('')}<button class="btn small primary" id="saveDefense" ${x.finished?'disabled':''}>儲存防守位置</button><div class="small muted" style="margin-top:8px">打序與守備位置分開管理，換守位不會更動打擊棒次。投手位置由「更換投手」控制。</div></div>`;}
function historyPage(){let x=g();return `<div class="card"><div class="section-title"><h2>比賽事件紀錄</h2><span class="pill">${x.events.length} 筆</span></div><div class="row"><button class="btn small" id="undo2" ${!undoStack.length?'disabled':''}>↶ 復原最近一次</button><button class="btn small" id="redo2" ${!futureStack.length?'disabled':''}>↷ 重做</button></div><div class="notice blue" style="margin-top:10px">本版支援最近 25 次操作復原（同一次開啟期間）；不支援直接編輯很久之前的單筆事件。正式比賽請定期匯出 JSON 保存。</div>${[...x.events].reverse().map((e,i)=>`<div class="event"><div class="n">#${x.events.length-i}<br>${e.inning}${e.half==='top'?'上':'下'}</div><div><b>${esc(e.message)}</b><div class="desc">${esc(e.desc)} · ${new Date(e.time).toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'})}</div></div></div>`).join('')||'<div class="empty">尚未登錄任何事件</div>'}</div>`;}
function filesPage(){let x=g();return `<div class="card"><h2>匯出比賽圖片</h2><p class="muted">產生包含 1～9 局比分、雙方打擊數據、投手數據的 PNG 圖片，方便傳給小編或分享 LINE。投手會依「單場數據」目前選擇的分次／合併模式輸出。</p><button class="btn orange" id="exportPNG">產生分享圖片 PNG</button></div><div class="card"><h2>本機資料備份</h2><div class="notice red">瀏覽器本機保存不是永久備份。手機換機、清除快取或瀏覽器資料時可能遺失；比賽結束務必下載 JSON。</div><div class="row"><button class="btn primary" id="exportJSON">匯出本場 JSON 備份</button><button class="btn" id="exportCSV">匯出本場 CSV 統計</button><label class="btn" style="margin:0;color:var(--text);display:inline-flex;align-items:center;cursor:pointer">匯入 JSON<input type="file" id="importJSON" accept=".json,application/json" hidden></label></div></div><div class="card"><h2>球隊 Logo</h2><div class="row"><div class="logo" id="logoSettings"><img src="./logo-tianrui.png" alt="天睿隊徽"></div><div class="grow"><div class="small muted">載入現有 Logo 圖片，會用於首頁及匯出報表。圖片僅儲存在這個瀏覽器內。</div><label class="btn small" style="display:inline-block;cursor:pointer;margin-top:6px">選擇 PNG／JPG<input type="file" id="logoUpload" accept="image/png,image/jpeg,image/webp" hidden></label></div></div><div class="divider"></div><h3>畫面縮放</h3><input id="fontScale" type="range" min="0.9" max="1.25" step="0.05" value="${db.settings.scale||1}" style="width:100%"><div class="small muted">此設定儲存於本機。</div></div><div class="card"><h2>比賽管理</h2><p class="muted">時間到可以提前結束，之後仍可查看及匯出成績。</p><div class="row">${!x.finished?'<button class="btn danger" id="finish2">結束這場比賽</button>':''}<button class="btn" id="backHome">返回全部比賽</button><button class="btn danger" id="deleteGame">刪除此場</button></div></div>`;}
function render(){document.documentElement.style.setProperty('--scale',db.settings.scale||1);let logo=document.getElementById('logo');if(logo)logo.innerHTML=`<img src="${db.logo||'./logo-tianrui.png'}" alt="天睿隊徽">`;let x=g(),content;if(tab==='home'||!x)content=homePage();else if(tab==='record')content=recordPage();else if(tab==='stats')content=statsPage();else if(tab==='lineup')content=lineupPage();else if(tab==='history')content=historyPage();else content=filesPage();document.getElementById('app').innerHTML=tab==='home'||!x?content:appShell(content);if(x&&tab==='files'){document.getElementById('logoSettings').innerHTML=`<img src="${db.logo||'./logo-tianrui.png'}" alt="天睿隊徽">`;}document.getElementById('modalhost').innerHTML=modal||'';}
function showModal(s){modal=`<div class="modalback"><div class="modal" role="dialog" aria-modal="true">${s}</div></div>`;render();let close=document.querySelector('.modalback');if(close)close.addEventListener('click',e=>{if(e.target===close)closeModal()});}
function closeModal(){modal=null;render();}
function selectDest(value){return `<option value="1" ${value==='1'?'selected':''}>一壘</option><option value="2" ${value==='2'?'selected':''}>二壘</option><option value="3" ${value==='3'?'selected':''}>三壘</option><option value="H" ${value==='H'?'selected':''}>回本壘得分</option><option value="O" ${value==='O'?'selected':''}>出局</option>`;}
function erSelect(value='pending'){return `<option value="pending" ${value==='pending'?'selected':''}>待判定</option><option value="yes" ${value==='yes'?'selected':''}>是自責分</option><option value="no" ${value==='no'?'selected':''}>非自責分</option>`;}
function moveRow(key,label,dest,er='pending'){return `<div class="movegrid"><b class="small">${esc(label)}</b><div class="field"><select data-move="${key}" aria-label="${esc(label)} 跑壘結果">${selectDest(dest)}</select></div><div class="field"><select data-er="${key}" aria-label="${esc(label)} 自責分">${erSelect(er)}</select></div></div>`;}
function movesNote(){return `<div class="small muted" style="margin:7px 0">僅「回本壘得分」者需選擇自責分；其他人選項會被忽略。若有複雜得分，請由紀錄員依判決調整。</div>`;}
function defaultMoves(type){let x=g(),r={};for(let i=0;i<3;i++){if(x.bases[i])r['r'+i]=String(i+1);}let bat='O';switch(type){
