<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>天睿賽程｜管理者發布</title><style>
:root{font-family:system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;background:#f3f5f8;color:#20354c}*{box-sizing:border-box}body{margin:0}header{background:#132b46;color:white;padding:17px}.container{max-width:660px;margin:20px auto;padding:0 12px}.card{background:white;border:1px solid #e1e8ef;border-radius:16px;padding:18px;margin-bottom:14px}h1{font-size:23px;margin:0 0 12px}h2{font-size:17px}.muted{font-size:12px;color:#6b7e91;line-height:1.7}.btn{border:1px solid #cbd8e5;background:white;color:#21415e;border-radius:10px;padding:11px 13px;min-height:43px;cursor:pointer;font-weight:800}.btn.orange{background:#f58a31;border-color:#f58a31;color:#1c3349;width:100%;margin-top:12px}.btn:disabled{opacity:.5}.field{width:100%;border-radius:10px;border:1px solid #cddae7;padding:12px;font:inherit}.msg{background:#f1f6fb;border:1px solid #d5e4f1;border-radius:10px;padding:13px;font-size:12px;line-height:1.7;margin-top:12px}a{color:#2d5f91}.game{font-size:12px;border-bottom:1px solid #ecf1f6;padding:9px 0}
</style></head><body><header><strong>天睿教育棒球隊 · 賽程發布</strong></header><main class="container"><div class="card"><p><a href="./schedule.html?manage=1">← 回賽程管理</a></p><h1>確認發布本季賽程</h1><div id="summary">正在確認草稿</div><div id="list"></div></div><div class="card"><h2>管理者 GitHub 授權</h2><p class="muted">需建立 GitHub fine-grained personal access token，Repository access 只勾選 <b>YKC1117/tianrui-baseball-scorebook</b>，權限只開啟 <b>Contents: Read and write</b>。授權碼只用於本次發布，**不會儲存**。勿透過 LINE 或聊天室分享。</p><label for="token" class="muted">GitHub Token</label><input id="token" type="password" class="field" autocomplete="off" placeholder="github_pat_..."><p><a target="_blank" rel="noopener" href="https://github.com/settings/personal-access-tokens/new">前往 GitHub 建立授權碼 ↗</a></p><button class="btn" id="backup">↓ 下載校對完成的賽程 JSON</button><button class="btn orange" id="publish">正式發布給所有隊友</button><div id="msg" class="msg">發布僅更新公開賽程檔，不會修改任何球員名單或比賽成績。</div></div></main>
<script>
(()=>{'use strict';const E=id=>document.getElementById(id),KEY='TR-SCHEDULE-PENDING-1';let d;try{d=JSON.parse(sessionStorage.getItem(KEY)||'null')}catch{}const say=(x)=>E('msg').textContent=x;if(!d||d.format!=='TR-SCHEDULE-1'||!Array.isArray(d.games)){E('publish').disabled=true;say('找不到等待發布的賽程。請回到賽程管理重新檢查。');return}E('summary').textContent=d.season+' · '+d.games.length+' 場比賽';const escape=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));E('list').innerHTML=d.games.slice(0,14).map(g=>'<div class="game">'+escape(g.date)+' '+escape(g.time)+' ｜ 天睿教育 VS '+escape(g.opponent)+'</div>').join('');E('backup').onclick=()=>{let u=URL.createObjectURL(new Blob([JSON.stringify(d,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='天睿教育_賽程備份.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),3000)};function encode(s){const bytes=new TextEncoder().encode(s);let out='';for(let i=0;i<bytes.length;i+=8192)out+=String.fromCharCode(...bytes.subarray(i,i+8192));return btoa(out)}E('publish').onclick=async()=>{let token=E('token').value.trim();if(!/^(github_pat_|ghp_)/.test(token)){say('請填入 GitHub 授權碼。');return}if(!confirm('確定用「'+d.season+'」的 '+d.games.length+' 場賽程取代目前公開資料？'))return;E('publish').disabled=true;say('正在向 GitHub 確認目前賽程版本…');const endpoint='https://api.github.com/repos/YKC1117/tianrui-baseball-scorebook/contents/schedule.json',headers={'Accept':'application/vnd.github+json','Authorization':'Bearer '+token,'X-GitHub-Api-Version':'2022-11-28'};try{let r=await fetch(endpoint+'?ref=main',{headers,cache:'no-store'}),sha=null;if(r.ok)sha=(await r.json()).sha;else if(r.status!==404)throw Error('讀取 GitHub 原始賽程失敗：HTTP '+r.status);let payload={message:'data(schedule): publish '+d.season,content:encode(JSON.stringify({...d,updatedAt:new Date().toISOString()},null,2)),branch:'main'};if(sha)payload.sha=sha;say('正在上傳賽程資料，請勿關閉頁面…');let w=await fetch(endpoint,{method:'PUT',headers:{...headers,'Content-Type':'application/json'},body:JSON.stringify(payload)});if(!w.ok){let msg='';try{msg=(await w.json()).message||''}catch{}throw Error('發布失敗：HTTP '+w.status+(msg?' '+msg:''))}sessionStorage.removeItem(KEY);localStorage.removeItem('TR-SCHEDULE-DRAFT-1');E('token').value='';say('GitHub 提交成功！GitHub Pages 可能需要數分鐘才會發布新賽程，請隊友稍後連網重新整理。');E('publish').textContent='已提交';}catch(err){say(err.message+'。草稿仍保留，請核對授權與網路後重試。');E('publish').disabled=false}finally{E('token').value=''}}})();
</script></body></html>
