</style></head><body><header><div class="bar"><img src="./logo-tianrui.png" alt="天睿 Logo"><b>天睿教育棒球隊</b><a href="./index.html">⚾ 場邊紀錄</a></div></header><main class="wrap"><section class="hero"><small>TIANRUI BASEBALL · SCHEDULE</small><h1>球隊賽程中心</h1><p>查看每場對手、日期、開賽時間與球場。每季由球隊管理者更新。</p><button id="toggle" class="btn orange">⚙ 賽程管理</button></section><section class="card"><div class="row between"><div><h2 id="season">球隊賽程</h2><div id="updated" class="muted"></div></div><button id="refresh" class="btn">↻ 重新整理</button></div><div class="formGrid" style="margin:12px 0"><div class="field"><label>月份</label><select id="month"></select></div><div class="field"><label>狀態</label><select id="filter"><option value="all">全部</option><option value="scheduled">預定開賽</option><option value="postponed">延期</option><option value="cancelled">取消</option><option value="completed">已完成</option></select></div></div><div id="games"></div><div class="notice">離線時只會顯示上次成功查詢的賽程，出發前請連網重新整理。</div></section><div id="manager" class="hide"><section class="card"><h2>① 上傳新一季賽程圖片</h2><div class="formGrid"><div class="field"><label>賽季名稱</label><input id="seasonEdit" placeholder="例如：2027 春季聯賽"></div><div class="field"><label>賽程年份</label><input id="yearEdit" type="number" min="2020" max="2100"></div></div><label class="photo">選擇 JPG／PNG 賽程表圖片<input id="upload" type="file" accept="image/*" style="display:block;margin:10px auto 0;max-width:100%"></label><div id="photoView"></div><div class="act"><button id="ocr" class="btn orange" disabled>辨識圖片文字</button><span id="ocrStatus">請先選擇圖片。首次辨識需有網路。</span></div><details><summary>檢視／修正辨識文字（也可直接貼上）</summary><div class="field"><textarea id="raw" rows="7" placeholder="例如：11/15 09:00 天睿教育 VS 勁棒隊 永康棒球場"></textarea></div><button id="parse" class="btn dark">整理成可編輯場次</button></details><div id="parseNote" class="notice" style="margin-top:12px">圖片只在此裝置辨識，不會上傳原始圖片。OCR 可能讀錯日期、對手或場地，發布前務必逐場核對。</div></section><section class="card"><div class="row between"><h2>② 核對每場賽程</h2><button id="add" class="btn dark">＋ 新增場次</button></div><div id="editList"></div><div class="row"><button id="save" class="btn">儲存本機草稿</button><button id="download" class="btn">↓ 備份 JSON</button><label class="btn">↑ 匯入 JSON<input type="file" id="import" accept=".json" hidden></label></div></section><section class="card"><h2>③ 公開發布</h2><div class="notice warning">公開發布需要管理者的 GitHub 授權。OCR 只負責建立草稿，未經校對的資料不會自動公開。</div><button id="next" class="btn orange" style="margin-top:12px;width:100%">確認完成，前往發布 →</button></section></div><p class="info" style="text-align:center">天睿教育棒球隊 · 公開賽程資訊</p></main><script>
(()=>{'use strict';const E=id=>document.getElementById(id),K='TR-SCHEDULE-PUBLIC-1',D='TR-SCHEDULE-DRAFT-1',P='TR-SCHEDULE-PENDING-1',esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let publicData={format:'TR-SCHEDULE-1',season:'賽程尚未公布',games:[]},draft=null,file=null,editing=false;function uid(){return 'm'+Date.now()+'-'+Math.random().toString(16).slice(2)}function cache(k,d){localStorage.setItem(k,JSON.stringify(d))}function read(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch{return null}}function validDate(s){if(!/^\d{4}-\d{2}-\d{2}$/.test(s))return false;let d=new Date(s+'T00:00:00');return !isNaN(d)&&[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')===s}function shown(){E('season').textContent=publicData.season;E('updated').textContent=publicData.updatedAt?'更新於 '+new Date(publicData.updatedAt).toLocaleString('zh-TW'):'尚未公布新賽程';let values=['all',...new Set(publicData.games.filter(g=>validDate(g.date)).map(g=>g.date.slice(0,7)))];E('month').innerHTML=values.map(v=>'<option value="'+v+'">'+(v==='all'?'全部月份':v+' 月')+'</option>').join('');draw()}function matchup(g){let vs=' <span style="color:#dd822e">VS</span> ';return g.teamSide==='right'?esc(g.opponent)+vs+' 天睿教育':'天睿教育'+vs+esc(g.opponent)}function draw(){let m=E('month').value,s=E('filter').value,ls=publicData.games.filter(g=>validDate(g.date)&&(m==='all'||g.date.startsWith(m))&&(s==='all'||g.status===s)).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));E('games').innerHTML=ls.length?ls.map(g=>{let d=new Date(g.date+'T00:00:00'),w='日一二三四五六'[d.getDay()];return '<article class="match"><div class="date">'+(d.getMonth()+1)+'月<b>'+d.getDate()+'</b><small>星期'+w+'</small></div><div class="details"><strong>'+matchup(g)+'</strong><div class="meta">📍 '+esc(g.venue||'場地待公告')+(g.notes?'<br>'+esc(g.notes):'')+'</div></div><div style="text-align:right"><div class="time">'+esc(g.time)+'</div>'+(g.endTime?'<div class="meta">至 '+esc(g.endTime)+'</div>':'')+'<span class="pill">'+(g.status==='scheduled'&&new Date(g.date+'T23:59:59+08:00')<new Date()?'日期已過・成績待補':({scheduled:'預定開賽',postponed:'延期',cancelled:'取消',completed:'已完成'}[g.status]||'預定開賽'))+'</span></div></article>'}).join(''):'<p class="muted" style="padding:25px;text-align:center">目前沒有符合條件的賽程；管理者可於上方新增。</p>';}async function fetchData(){try{let r=await fetch('./schedule.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('網路失敗');let x=await r.json();if(x.format!=='TR-SCHEDULE-1'||!Array.isArray(x.games))throw Error('資料格式錯誤');publicData=x;cache(K,x)}catch{publicData=read(K)||publicData}shown()}function gather(){if(!draft)return;draft.season=E('seasonEdit').value;draft.games=[...document.querySelectorAll('.edit')].map(n=>({id:n.dataset.id,date:n.querySelector('[data-date]').value,time:n.querySelector('[data-time]').value,opponent:n.querySelector('[data-opponent]').value,venue:n.querySelector('[data-venue]').value,status:n.querySelector('[data-status]').value,notes:n.querySelector('[data-notes]').value}))}function edits(){E('editList').innerHTML=draft.games.length?draft.games.map((g,i)=>'<div class="edit" data-id="'+esc(g.id)+'"><div class="row between"><b>第 '+(i+1)+' 場</b><button class="btn" data-delete="'+esc(g.id)+'">移除</button></div><div class="formGrid"><div class="field"><label>日期 *</label><input data-date type="date" value="'+esc(g.date)+'"></div><div class="field"><label>時間 *</label><input data-time type="time" value="'+esc(g.time)+'"></div><div class="field"><label>對手 *</label><input data-opponent value="'+esc(g.opponent)+'"></div><div class="field"><label>場地</label><input data-venue value="'+esc(g.venue)+'"></div><div class="field"><label>狀態</label><select data-status>'+[['scheduled','預定'],['postponed','延期'],['cancelled','取消'],['completed','完成']].map(z=>'<option value="'+z[0]+'" '+(g.status===z[0]?'selected':'')+'>'+z[1]+'</option>').join('')+'</select></div><div class="field"><label>備註</label><input data-notes value="'+esc(g.notes)+'"></div></div></div>').join(''):'<p class="muted">尚無賽程，請先辨識或新增一場。</p>'}function add(g){gather();draft.games.push(Object.assign({id:uid(),date:'',time:'',opponent:'',venue:'',status:'scheduled',notes:''},g||{}));edits();cache(D,draft)}function editMode(){editing=!editing;E('manager').classList.toggle('hide',!editing);if(editing){draft=read(D)||JSON.parse(JSON.stringify(publicData));E('seasonEdit').value=draft.season;E('yearEdit').value=new Date().getFullYear();edits()}E('toggle').textContent=editing?'關閉賽程管理':'⚙ 賽程管理';if(editing)E('manager').scrollIntoView({behavior:'smooth'})}function parseText(){let raw=E('raw').value.replace(/[０-９]/g,c=>String(c.charCodeAt(0)-65296)),rows=[],year=Number(E('yearEdit').value)||new Date().getFullYear();for(let line of raw.split(/\r?\n/)){let m=line.match(/(?<!\d)(20\d{2}|1\d{2})[\/.-](\d{1,2})[\/.-](\d{1,2})/),year2=year,mo,day;if(m){year2=Number(m[1]);if(year2<200)year2+=1911;mo=m[2];day=m[3]}else{m=line.match(/(?<!\d)(\d{1,2})[\/月.-](\d{1,2})/);if(!m)continue;mo=m[1];day=m[2]}let date=[year2,mo.padStart(2,'0'),day.padStart(2,'0')].join('-'),tm=line.match(/(?<!\d)([01]?\d|2[0-3])[:：時]([0-5]\d)/);if(!validDate(date))continue;let venue=(line.match(/[\u4e00-\u9fff\w]{2,20}(?:棒球場|壘球場|球場|運動公園)/)||[])[0]||'',vs=line.split(/\bVS\b|對戰|對/i),opp='';if(vs.length>1){opp=vs[1].replace(/\d{1,2}[:：]\d{2}/g,'').trim();if(venue)opp=opp.replace(venue,'').trim()}rows.push({date,time:tm?tm[1].padStart(2,'0')+':'+tm[2]:'',opponent:opp,venue})}if(!rows.length){E('parseNote').textContent='未能自動辨識日期，請手動新增場次。';return}gather();if(draft.games.length&&!confirm('取代目前草稿中的 '+draft.games.length+' 場嗎？'))return;draft.games=rows.map(x=>Object.assign({id:uid(),status:'scheduled',notes:''},x));edits();cache(D,draft);E('parseNote').textContent='辨識出 '+rows.length+' 筆日期。請檢查所有日期、對手與時間，空白欄位不得直接發布。'}function dl(){gather();let url=URL.createObjectURL(new Blob([JSON.stringify(draft,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='天睿賽程備份.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)}E('toggle').onclick=editMode;E('refresh').onclick=fetchData;E('month').onchange=draw;E('filter').onchange=draw;E('upload').onchange=e=>{file=e.target.files[0];E('ocr').disabled=!file;let u=file?URL.createObjectURL(file):'';E('photoView').innerHTML=u?'<img src="'+u+'" style="max-width:100%;max-height:280px;display:block;margin:auto">':''};E('ocr').onclick=async()=>{if(!file)return;E('ocr').disabled=true;E('ocrStatus').textContent='正在載入繁中 OCR，請保持網路連線';let worker;try{if(!window.Tesseract){let s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';await new Promise((resolve,reject)=>{s.onload=resolve;s.onerror=reject;document.head.append(s)})}worker=await Tesseract.createWorker(['chi_tra','eng']);let r=await worker.recognize(file);E('raw').value=r.data.text||'';E('raw').closest('details').open=true;parseText();E('ocrStatus').textContent='辨識完成，請人工逐欄確認';}catch(e){E('ocrStatus').textContent='辨識失敗，請手動新增：'+e.message}finally{if(worker)await worker.terminate();E('ocr').disabled=false}};E('parse').onclick=parseText;E('add').onclick=()=>add();E('editList').onclick=e=>{let b=e.target.closest('[data-delete]');if(!b)return;gather();draft.games=draft.games.filter(x=>x.id!==b.dataset.delete);edits();cache(D,draft)};E('save').onclick=()=>{gather();cache(D,draft);alert('已保存本機草稿，尚未公開發布。')};E('download').onclick=dl;E('import').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let d=JSON.parse(await f.text());if(d.format!=='TR-SCHEDULE-1'||!Array.isArray(d.games))throw Error('格式不符');if(!confirm('取代目前本機賽程草稿？'))return;draft=d;E('seasonEdit').value=d.season;edits();cache(D,d)}catch(err){alert(err.message)}e.target.value=''};E('next').onclick=()=>{gather();if(!draft.season.trim()||!draft.games.length){alert('請先填賽季名稱及賽程');return}for(let g of draft.games){if(!validDate(g.date)||!/^([01]\d|2[0-3]):[0-5]\d$/.test(g.time)||!g.opponent.trim()){alert('有比賽的日期／時間／對手未填寫正確，請先核對');return}}cache(D,draft);sessionStorage.setItem(P,JSON.stringify(draft));location.href='./publish.html'};fetchData();if(location.search.includes('manage=1'))editMode()})();
</script></body></html>
