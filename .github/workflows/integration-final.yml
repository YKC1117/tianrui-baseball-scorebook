name: Integrated release candidate
on:
  pull_request:
jobs:
  integration-verification:
    if: startsWith(github.head_ref, 'work/integration-final')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      JAVA_TOOL_OPTIONS: -Xmx512m
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --ignore-scripts
      - run: npm run build:firebase
      - run: git diff --exit-code -- src/vendor
      - run: npm test
      - run: npm run test:firebase
      - name: Install browser dependencies over HTTPS
        run: |
          sudo sed -i 's|^URIs:.*|URIs: https://archive.ubuntu.com/ubuntu/|' /etc/apt/sources.list.d/ubuntu.sources
          npx playwright install --with-deps chromium webkit
      - name: Verify the actual integrated bundle with Auth and Firestore
        run: npm run test:firebase:browser
      - name: Preserve all approved UI and scoring flows
        run: npm run test:ui
      - run: git diff --exit-code -- preview/demo-data.json preview/tianrui-ui-preview.html
      - run: npm run build:integrated
      - run: npm run privacy:inventory
