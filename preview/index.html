<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#132c46"><meta name="description" content="天睿棒球紀錄系統 UI／UX 試用版。使用模擬資料，可直接操作。"><title>天睿棒球｜介面試用版</title><link rel="stylesheet" href="../src/ui-review.css"></head>
<body>
<a class="skipLink" href="#app">跳至主要內容</a>
<header class="siteHeader"><div class="headerInner"><div class="brand"><div class="logo" id="logo"><img src="./logo-tianrui.png" alt="天睿既有隊徽"></div><div><strong>天睿教育棒球隊</strong><small>TIANRUI BASEBALL CLUB</small></div></div><span class="headerBadge">場邊紀錄</span></div></header>
<main class="app" id="app"></main><div id="modalhost"></div>

<script type="module" src="./app.mjs"></script>
</body></html>
